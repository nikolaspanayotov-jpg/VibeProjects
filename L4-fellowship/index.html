function renderEvidence() {
  const draft=ui.evidenceDraft||state.evidenceDraft||newEvidence();ui.evidenceDraft=draft;
  const entries=state.evidence.filter(e=>!ui.evidenceFilter||e.links.some(l=>l.id===ui.evidenceFilter));

"panel" id="evidence-editor"><h2>${state.evidence.some(e=>e.id===draft.id)?'Edit reflection':'Build an evidence reflection'}</h2><form id="evidence-form">${field('Generic title','ev-title',draft.title,'text','required maxlength="200"')}${field('Project alias','ev-project',draft.project,'text','maxlength="200"')}${field('Date','ev-date',draft.date,'date','required')}${field('Approved evidence reference ID','ev-reference',draft.reference,'text','maxlength="500" placeholder="A safe reference, not a sensitive file path"')}${area('Situation, task, my actions and result','ev-reflection',draft.reflection,'rows="7" placeholder="Distinguish your own contribution from the team’s work."')}${area('Learning and next action','ev-learning',draft.learning,'rows="3"')}<details open><summary>Choose linked KSBs</summary><fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">KSBs supported by this reflection</legend><div class="check-grid">${IDS.map(id=>`<label class="check-label"><input type="checkbox" name="ev-ksbs" value="${id}"${draft.links.some(l=>l.id===id)?' checked':''}>${id}</label>`).join('')}</div></fieldset></details><div id="evidence-rationales">${evidenceRationales(draft)}</div>${selectField('Evidence state','ev-status',{draft:EVIDENCE.draft,linked:EVIDENCE.linked,reviewed:EVIDENCE.reviewed},draft.status)}<div id="evidence-review-fields"${draft.status==='reviewed'?'':' hidden'}>${area('Review note (role and feedback, if safe to retain)','ev-review-note',draft.reviewNote,'rows="3"')}${field('Review date','ev-review-date',draft.reviewDate,'date')}<p class="small muted">A recorded review does not imply assessor approval.</p></div><p id="evidence-error" class="error-text" role="alert" tabindex="-1"></p><button class="button" type="submit">Save reflection</button><p class="small muted" style="margin-top:12px">Unfinished form text is kept as a local draft.</p></form></section></div>`;

function evidenceRationales(draft) { return draft.links.map(link=>`<div class="rationale-field">${area(`${link.id}: how this example supports the KSB`,`ev-rationale-${link.id}`,link.rationale,'rows="3"')}</div>`).join(''); }
function captureEvidence() { const form=document.getElementById('evidence-form');if(!form)return;const f=new FormData(form),old=ui.evidenceDraft||newEvidence();ui.evidenceDraft={id:old.id,title:String(f.get('ev-title')||''),project:String(f.get('ev-project')||''),date:String(f.get('ev-date')||''),reference:String(f.get('ev-reference')||''),reflection:String(f.get('ev-reflection')||''),learning:String(f.get('ev-learning')||''),status:String(f.get('ev-status')||'draft'),reviewNote:String(f.get('ev-review-note')||''),reviewDate:String(f.get('ev-review-date')||''),links:f.getAll('ev-ksbs').map(id=>({id:String(id),rationale:String(f.get('ev-rationale-'+id)??old.links.find(l=>l.id===id)?.rationale??'')}))};state.evidenceDraft=clone(ui.evidenceDraft);saveSoon(); }
function commitEvidence() { captureEvidence();const e=ui.evidenceDraft,errorEl=document.getElementById('evidence-error');let error='';if(!e.title.trim())error='Give this reflection a generic title.';else if(!validDate(e.date))error='Choose a valid date.';else if(e.status!=='draft'&&(!e.reference.trim()||!e.links.length||e.links.some(l=>!l.rationale.trim())))error='To link evidence, add an approved reference and a rationale for every selected KSB.';else if(e.status==='reviewed'&&(!e.reviewNote.trim()||!validDate(e.reviewDate)))error='Record the review note and its date, or choose a different evidence state.';if(error){errorEl.textContent=error;errorEl.focus();return;}const i=state.evidence.findIndex(x=>x.id===e.id);if(i<0)state.evidence.push(clone(e));else state.evidence[i]=clone(e);state.evidenceDraft=null;ui.evidenceDraft=null;save();render();toast(storageWritable?'Reflection saved on this device.':'Reflection kept in temporary memory. Export a backup.'); }
function makeQueue() {
  let ids=[ui.practiceId];
  if(ui.practiceMode==='mixed')ids=ui.mixed;
  if(ui.practiceMode==='weak'){ids=[...IDS].sort((a,b)=>{const rank=id=>state.ksbs[id].recall==='help'?0:state.ksbs[id].recall==='partial'?1:state.ksbs[id].recall==='none'?2:3;return rank(a)-rank(b)||IDS.indexOf(a)-IDS.indexOf(b);}).slice(0,3);}
  return ids.map(id=>({id,type:ui.practiceMode==='probe'?'probe':ui.practiceMode==='followup'?'followup':ui.practiceMode==='project'?'project':'question'}));
}
function practiceQuestion(q) { const k=BY_ID[q.id];if(q.type==='probe')return k.probe;if(q.type==='followup')return k.followup;if(q.type==='project'){const e=evidenceFor(q.id)[0];return `${e?'Using your reflection “'+e.title+'”':'Using a genuine project example'}, explain ${k.id}: what you personally did, why, how you validated it, the result and what you learned. ${k.question}`;}return k.question; }

  const q=session.queue[session.index],k=BY_ID[q.id];
  return `${heading('Discussion practice','Use your own words. An honest gap is a useful next step.')}<section class="panel"><div class="session-strip"><div><span class="inline-badge">${q.id}</span> <span class="small muted">Question ${session.index+1} of ${session.queue.length}</span></div>${session.timer?`<div class="timer"><output id="session-time" aria-label="Time remaining"></output><button class="button secondary small" data-action="toggle-timer" id="timer-toggle">${session.running?'Pause':'Resume'}</button><button class="text-button small" data-action="reset-timer">Reset timer</button></div>`:'<span class="small muted">Untimed session</span>'}</div><div class="small muted">${esc(k.title)}</div><h2 class="practice-question">${esc(practiceQuestion(q))}</h2><p class="small muted">Write a response or answer aloud. You can pause and return; your session is kept on this device.</p>${area('My practice response','practice-response',session.response,'class="practice-response" rows="7"')}<div class="button-row"><button class="button" data-action="reveal-answer" aria-controls="practice-guide" aria-expanded="${session.revealed}"${session.revealed?' disabled':''}>${session.revealed?'Answer guide revealed':'Show answer guide'}</button><button class="button secondary" data-action="pause-practice">Pause and return to Today</button><button class="text-button" data-action="end-practice">End session</button></div><div id="timer-finished" class="note" hidden>Time is up. Continue at your own pace or record your review. Your response is still here.</div></section>${session.revealed?`<div class="compare-grid" id="practice-guide"><section class="reading-panel"><h2>Compare with the guide</h2><div class="answer-notice">Check accuracy, your own application, the rationale, validation and limitations. This is a study guide, not automated marking.</div><div class="prose">${k.guide}</div><details><summary>Make it yours and link evidence</summary><div class="template">${k.template}</div><div class="prose">${k.evidence}</div></details></section><section class="form-panel"><h2>What could I strengthen?</h2>${targetsHtml(q.id,'practice')}${area('Gap or next action','practice-gap',session.gap,'rows="3"')}${field('Next review date (optional)','practice-review-date',session.nextDate||'','date')}<p class="small muted">Leave the date blank to use the recall-based review suggestion.</p><h3>How did the recall go?</h3><div class="rating-buttons"><button class="button secondary" data-action="rate-practice" data-result="help">Needed help</button><button class="button secondary" data-action="rate-practice" data-result="partial">Partial</button><button class="button positive" data-action="rate-practice" data-result="independent">Explained independently</button></div><p class="small muted" style="margin-top:15px">Recording a recall does not mark workplace evidence complete.</p><button class="text-button" data-action="use-practice-response">Use this response in my personal answer</button></section></div>`:'<div id="practice-guide" hidden></div>'}`;

function statisticsLabResult() { const settings=state.learningTools.labs.statistics,source=[2,3,3,4,settings.outlier],observed=settings.excludeOutlier?source.slice(0,-1):source,fill=settings.missing==='zero'?0:settings.missing==='median'?medianOf(observed):null,values=fill===null?observed:[...observed,fill],mean=values.reduce((a,b)=>a+b,0)/values.length,median=medianOf(values),observedMean=observed.reduce((a,b)=>a+b,0)/observed.length;return `<h3>One dataset, different assumptions</h3><div class="data-pills" aria-label="Source durations">${source.map((v,i)=>`<span${i===4?' class="extreme"':''}>${v} days</span>`).join('')}<span class="missing-value">Unknown</span></div><div class="lab-metrics"><div><strong>${numeric(mean)}</strong><span>Selected-treatment mean, days</span></div><div><strong>${numeric(median)}</strong><span>Selected-treatment median, days</span></div><div><strong>${values.length}</strong><span>Values included</span></div></div><p role="status" class="lab-status">${source.length} observed values and one unknown. ${settings.excludeOutlier?'The largest observed value is excluded for this comparison. ':''}${fill===null?'The unknown is excluded, not treated as zero.':'The unknown is filled with '+fill+' as an assumption.'}</p><p>The mean of the retained observed values alone is <strong>${numeric(observedMean)} days</strong>. ${settings.outlier>8&&!settings.excludeOutlier?'The large observation pulls the mean upward while the median remains less affected.':''} ${settings.missing==='zero'?'Filling with zero adds an unobserved zero-day case and changes the denominator.':''}</p><div class="table-scroll" tabindex="0" role="region" aria-label="Duration treatment table"><table><thead><tr><th scope="col">Record</th><th scope="col">Source value</th><th scope="col">Treatment</th></tr></thead><tbody>${source.map((v,i)=>`<tr><th scope="row">${i+1}</th><td>${v} days</td><td>${i===4&&settings.excludeOutlier?'Excluded for comparison; not proved wrong':'Observed, retained'}</td></tr>`).join('')}<tr><th scope="row">6</th><td>Unknown</td><td>${fill===null?'Unknown, excluded':`Imputed as ${fill}; not an observed fact`}</td></tr></tbody></table></div>`; }
function joinLabData() { const s=state.learningTools.labs.joins,left=[['R1','A',10],['R2','A',20],['R3','B',30],['R4','X',40]],lookup=[['A','Alpha'],['B','Beta'],['C','Gamma']];if(s.duplicate)lookup.push(['A','Conflicting Alpha']);if(s.type.startsWith('union')){const right=[['R3','B',30],['R5','C',50]],combined=[...left,...right],rows=s.type==='union'?combined.filter((row,i)=>combined.findIndex(r=>JSON.stringify(r)===JSON.stringify(row))===i):combined;return {left,right,rows:rows.map(r=>[r[0],r[1],'—',r[2],'Appended request']),union:true};}const rows=[];left.forEach(request=>{const matches=lookup.filter(row=>row[0]===request[1]);if(matches.length)matches.forEach(row=>rows.push([request[0],request[1],row[1],request[2],'Matched combination']));else if(['left','full'].includes(s.type))rows.push([request[0],request[1],null,request[2],'Unmatched request']);});if(['right','full'].includes(s.type))lookup.filter(row=>!left.some(request=>request[1]===row[0])).forEach(row=>rows.push([null,row[0],row[1],null,'Unmatched lookup']));return {left,right:lookup,rows,union:false}; }
function joinsLabResult() { const s=state.learningTools.labs.joins,data=joinLabData(),distinct=new Set(data.rows.filter(row=>row[0]).map(row=>row[0])).size,total=data.rows.reduce((sum,row)=>sum+(row[3]??0),0);return `<h3>${esc({inner:'INNER JOIN',left:'LEFT JOIN',right:'RIGHT JOIN',full:'FULL OUTER JOIN',union:'UNION',unionall:'UNION ALL'}[s.type])}: reconcile the result</h3><div class="lab-metrics"><div><strong>${data.rows.length}</strong><span>Output rows</span></div><div><strong>${distinct}</strong><span>Distinct request IDs represented</span></div><div><strong>${total}</strong><span>Sum of request measure</span></div></div><p class="lab-status" role="status">${data.union?'The two compatible request inputs contain six rows; R3 is identical in both.':'The left source has four requests and a measure total of 100. The lookup has '+data.right.length+' rows.'}</p><p>${data.union?(s.type==='union'?'UNION removes the identical R3 result row.':'UNION ALL keeps both R3 result rows; repeated rows may be legitimate or may double count.'):s.duplicate?'Each A request matches two conflicting lookup rows. Retaining requests does not guarantee preserving the count or measure.':'The lookup key is unique in this comparison. Check unmatched requests and unused reference rows as well as the row count.'}</p><details><summary>Inspect both input tables</summary><h4>Request input</h4><p class="small">request_id, service_id, measure</p><pre class="lab-input-table">${esc(data.left.map(row=>row.join(' | ')).join('\n'))}</pre><h4>${data.union?'Second compatible request input':'Service lookup input'}</h4><p class="small">${data.union?'request_id, service_id, measure':'service_id, service_name'}</p><pre class="lab-input-table">${esc(data.right.map(row=>row.join(' | ')).join('\n'))}</pre></details><div class="table-scroll" tabindex="0" role="region" aria-label="Join or union result"><table><thead><tr><th scope="col">Request</th><th scope="col">Key</th><th scope="col">Lookup label</th><th scope="col">Measure</th><th scope="col">Meaning</th></tr></thead><tbody>${data.rows.map(row=>`<tr>${row.map(value=>`<td>${value===null?'NULL':esc(value)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted">These are fictional values. NULL request measures on unused lookup rows are not converted into observed zeros; the displayed sum ignores those NULL measures.</p>`; }
function forecastCalculation() { const s=state.learningTools.labs.forecast,series=datasetRows('monthly').slice(1).map(row=>Number(row[1])),training=series.slice(0,s.window),n=training.length,tx=n*(n+1)/2,ty=training.reduce((a,b)=>a+b,0),txx=training.reduce((sum,_,i)=>sum+(i+1)**2,0),txy=training.reduce((sum,y,i)=>sum+(i+1)*y,0),slope=(n*txy-tx*ty)/(n*txx-tx*tx),intercept=(ty-slope*tx)/n,baseline=training.at(-1),rows=Array.from({length:s.horizon},(_,i)=>{const t=n+i+1;return {t,actual:series[t-1]??null,prediction:s.model==='trend'?intercept+slope*t:baseline,baseline};}),known=rows.filter(r=>r.actual!==null),rmse=key=>Math.sqrt(known.reduce((sum,r)=>sum+(r.actual-r[key])**2,0)/known.length);return {settings:s,series,training,rows,slope,intercept,baseline,known,rmse:rmse('prediction'),baselineRmse:rmse('baseline')}; }
function monthLabel(t) { return new Date(2025,t-1,1,12).toLocaleDateString('en-GB',{month:'short',year:'numeric'}); }
function forecastLabChart(data) { const {series,rows,settings}=data,width=720,height=320,maxT=Math.max(12,settings.window+settings.horizon),low=Math.floor((Math.min(...series,...rows.map(r=>r.prediction))-5)/10)*10,high=Math.ceil((Math.max(...series,...rows.map(r=>r.prediction))+5)/10)*10,x=t=>65+(t-1)/(maxT-1)*590,y=v=>255-(v-low)/(high-low)*195,actual=series.map((value,i)=>`${x(i+1)},${y(value)}`).join(' '),forecast=rows.map(r=>`${x(r.t)},${y(r.prediction)}`).join(' '),labels=[1,settings.window,12,maxT].filter((v,i,a)=>a.indexOf(v)===i);return `<figure class="lab-forecast-figure"><svg viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="lab-forecast-title lab-forecast-desc"><title id="lab-forecast-title">Synthetic forecast with ${settings.window} training months and ${settings.horizon} forecast months</title><desc id="lab-forecast-desc">Blue solid line: available actual observations. Green dashed line: selected forecasts. Shading identifies training observations. Exact actual and forecast values follow in a table. RMSE uses only later observed months.</desc><rect x="65" y="50" width="${x(settings.window)-65}" height="205" fill="#E6EDF7"/>${Array.from({length:5},(_,i)=>{const value=low+(high-low)*i/4;return `<path d="M65 ${y(value)}H655" stroke="#D6DFE7"/><text x="55" y="${y(value)+5}" text-anchor="end" class="lab-axis">${numeric(value,1)}</text>`;}).join('')}<polyline points="${actual}" fill="none" stroke="#174EA6" stroke-width="3"/><polyline points="${forecast}" fill="none" stroke="#176B52" stroke-width="3" stroke-dasharray="8 5"/>${rows.map(r=>`<circle cx="${x(r.t)}" cy="${y(r.prediction)}" r="3" fill="#176B52"/>`).join('')}<path d="M${x(settings.window)} 50V255" stroke="#4B5D6B" stroke-dasharray="3 4"/>${labels.map(t=>`<text x="${x(t)}" y="285" text-anchor="${t===1?'start':t===maxT?'end':'middle'}" class="lab-axis lab-month-label${t!==1&&t!==maxT?' lab-middle-label':''}">${monthLabel(t)}</text>`).join('')}</svg><figcaption>Solid blue: actuals. Dashed green: forecasts. Shaded area: training window. A forecast beyond December 2025 has no actual value here.</figcaption></figure>`; }
function forecastLabResult() { const d=forecastCalculation(),s=d.settings;return `<h3>Training, evaluation and projection are different</h3><div class="lab-metrics"><div><strong>${d.rmse.toFixed(3)}</strong><span>Candidate RMSE, requests</span></div><div><strong>${d.baselineRmse.toFixed(3)}</strong><span>Naive baseline RMSE</span></div><div><strong>${d.known.length}</strong><span>Held-out actuals evaluated</span></div></div><p class="lab-status" role="status">Training uses January–${monthLabel(s.window).split(' ')[0]} 2025 only. The ${s.horizon}-month forecast includes ${d.known.length} months with known held-out actuals; ${s.horizon-d.known.length} projections do not enter RMSE.</p><p><strong>Candidate:</strong> ${s.model==='trend'?`predicted requests = ${d.intercept.toFixed(3)} + ${d.slope.toFixed(3)}t, with January 2025 as t = 1.`:`each prediction equals the last training value, ${d.baseline}.`}</p>${forecastLabChart(d)}<div class="table-scroll" tabindex="0" role="region" aria-label="Forecast values and evaluation"><table><thead><tr><th scope="col">Month</th><th scope="col">Actual</th><th scope="col">Candidate</th><th scope="col">Naive baseline</th><th scope="col">Use</th></tr></thead><tbody>${d.rows.map(r=>`<tr><th scope="row">${monthLabel(r.t)}</th><td>${r.actual??'Not available'}</td><td>${numeric(r.prediction)}</td><td>${r.baseline}</td><td>${r.actual===null?'Projection only':'Held-out evaluation'}</td></tr>`).join('')}</tbody></table></div><p class="small muted">RMSE = square root of mean squared forecast error. Both methods use exactly the same available held-out months. This small result does not establish dependable future performance or annual seasonality.</p>`; }

function blankStudyTools() { return {repairs:{},methods:{},workshops:{},organisation:{},connections:{}}; }
function reasoningRecord(kind,id) {
 return state.studyTools[kind][id] || (kind==='repairs'?{choice:'',diagnosis:'',impact:'',revealed:false,updatedOn:''}:kind==='methods'?{choice:'',reason:'',assumptions:'',revealed:false,updatedOn:''}:kind==='workshops'?{draft:'',checks:[],exampleOpen:false,updatedOn:''}:kind==='organisation'?{note:'',reference:'',verifiedOn:'',updatedOn:''}:{response:'',updatedOn:''});
}
function validateStudyTools(raw) {
 const output=blankStudyTools();if(raw===undefined)return output;
 const fail=msg=>{throw new Error('Study tools: '+msg);};
 const object=(v)=>{if(!v||typeof v!=='object'||Array.isArray(v))fail('expected an object.');return v;};
 const txt=(v,max=5000)=>{if(v===undefined)return '';if(typeof v!=='string'||v.length>max)fail('invalid or oversized text.');return v;};
 const flag=v=>{if(v===undefined)return false;if(typeof v!=='boolean')fail('expected true or false.');return v;};
 const date=v=>{v=txt(v,10);if(v&&!validDate(v))fail('invalid calendar date.');return v;};
 object(raw);for(const key of Object.keys(raw))if(!Object.hasOwn(output,key))fail('unknown section.');
 for(const kind of Object.keys(output))for(const [id,value] of Object.entries(object(raw[kind]??{}))){
  const authored=kind==='workshops'?BY_ID[id]:REASONING[kind==='organisation'?'notebook':kind].find(x=>x.id===id);
  if(kind==='workshops'?!IDS.includes(id):!authored)fail('unknown '+kind+' identifier.');
  object(value);const r={updatedOn:date(value.updatedOn)};
  if(kind==='repairs'||kind==='methods'){
   r.choice=txt(value.choice,100);if(r.choice&&!authored.choices.some(c=>c.id===r.choice))fail('unknown choice.');r.revealed=flag(value.revealed);
   for(const f of kind==='repairs'?['diagnosis','impact']:['reason','assumptions'])r[f]=txt(value[f],2000);
   if(r.revealed&&(!r.choice||!r.updatedOn||(kind==='repairs'?!r.diagnosis.trim()||!r.impact.trim():!r.reason.trim()||!r.assumptions.trim())))fail('revealed feedback needs a complete response.');
  } else if(kind==='workshops'){
   r.draft=txt(value.draft,20000);r.exampleOpen=flag(value.exampleOpen);r.checks=value.checks??[];
   if(!Array.isArray(r.checks)||r.checks.length>REASONING.checklist.length||new Set(r.checks).size!==r.checks.length||r.checks.some(c=>!REASONING.checklist.some(x=>x.id===c))||(!r.draft.trim()&&r.checks.length))fail('invalid workshop self-checks.');r.checks=[...r.checks];
  } else if(kind==='organisation'){r.note=txt(value.note);r.reference=txt(value.reference,500);r.verifiedOn=date(value.verifiedOn);}
  else r.response=txt(value.response);
  output[kind][id]=r;
 }
 return output;
}

ected.ksbs.includes(l.id)).map(l=>`<p class="small"><strong>${l.id}:</strong> ${esc(l.rationale)||'Add a rationale for this KSB.'}</p>`).join('')}</article>`).join(''):`<p>No evidence reference is mapped to this connection yet. Link genuine work and explain which parts support each KSB.</p><button class="button secondary small" data-action="add-evidence-topic" data-id="${selected.ksbs.find(id=>id[0]==='S')}">Link an evidence reflection</button>`}</section></div></div>`;

function captureStudyInput(el) {

 if(el.closest('#organisation-form')){captureOrganisation();return true;}
 if(el.id==='workshop-draft'){
  const r=clone(reasoningRecord('workshops',ui.workshopKsb));r.draft=el.value.slice(0,20000);r.checks=[];r.updatedOn=localDate();state.studyTools.workshops[ui.workshopKsb]=r;
  document.querySelectorAll('[data-workshop-check]').forEach(x=>{x.checked=false;x.disabled=!r.draft.trim();});document.querySelector('[data-action="workshop-use"]').disabled=!r.draft.trim();saveSoon();return true;
 }
 if(el.dataset.workshopCheck){const r=clone(reasoningRecord('workshops',ui.workshopKsb));r.checks=Array.from(document.querySelectorAll('[data-workshop-check]:checked')).map(x=>x.dataset.workshopCheck);r.updatedOn=localDate();state.studyTools.workshops[ui.workshopKsb]=r;saveSoon();return true;}

function studyToolClick(action,button) {
 if(action==='reset-reasoning') {if(confirm('Clear this activity’s explanation and selection so you can try again? Other activities stay saved.')){delete state.studyTools[button.dataset.kind][button.dataset.id];save();render(true);}return true;}
 if(action==='workshop-reveal'){const r=clone(reasoningRecord('workshops',ui.workshopKsb));r.exampleOpen=!r.exampleOpen;r.updatedOn=localDate();state.studyTools.workshops[ui.workshopKsb]=r;save();render();document.querySelector('[data-action="workshop-reveal"]').focus({preventScroll:true});return true;}
 if(action==='workshop-load') {const r=clone(reasoningRecord('workshops',ui.workshopKsb));if(r.draft&&r.draft!==state.ksbs[ui.workshopKsb].response&&!confirm('Replace this workshop draft with your saved KSB response?'))return true;r.draft=state.ksbs[ui.workshopKsb].response;r.checks=[];r.updatedOn=localDate();state.studyTools.workshops[ui.workshopKsb]=r;save();render();document.getElementById('workshop-draft').focus();return true;}
 if(action==='workshop-use'){const id=ui.workshopKsb,r=reasoningRecord('workshops',id);if(!r.draft.trim())return true;if(state.ksbs[id].response&&state.ksbs[id].response!==r.draft&&!confirm('Replace your saved '+id+' response with this workshop draft?'))return true;state.ksbs[id].response=r.draft;state.ksbs[id].exampleConfirmed=false;save();toast('Draft copied to '+id+'. Review your personal example and coverage in the KSB lesson.');return true;}
 if(action==='clear-organisation'){if(confirm('Clear this organisation note, reference and verification date?')){delete state.studyTools.organisation[button.dataset.id];save();render();}return true;}
 return false;
}
function studyToolsSummary() {
 const lines=['','## Reasoning practice and workplace context',''];
 for(const kind of ['repairs','methods'])for(const [id,r] of Object.entries(state.studyTools[kind])){const item=REASONING[kind].find(x=>x.id===id);lines.push('### '+item.title,'Choice: '+(item.choices.find(c=>c.id===r.choice)?.label||'Not selected'));for(const f of kind==='repairs'?['diagnosis','impact']:['reason','assumptions'])lines.push(f+': '+r[f]);lines.push('Feedback viewed: '+(r.revealed?'yes':'no'),'');}
 for(const [id,r] of Object.entries(state.studyTools.workshops))lines.push('### Workshop draft: '+id,r.draft,'Self-checks: '+(r.checks.join(', ')||'None'),'');
 for(const [id,r] of Object.entries(state.studyTools.organisation))lines.push('### Organisation: '+REASONING.notebook.find(x=>x.id===id).title,r.note,'Reference: '+r.reference,'Last verified by me: '+(r.verifiedOn||'Not recorded'),'');
 for(const [id,r] of Object.entries(state.studyTools.connections))lines.push('### Connection: '+REASONING.connections.find(x=>x.id===id).title,r.response,'');
 return lines;
}

function blankRehearsal() { return {uncertainty:{n:50,sd:8,effect:2,level:95,threshold:3,seed:1},calibration:{},changes:{},briefings:{},retrieval:{},lastBackupOn:''}; }
function validateRehearsal(raw) {
 const out=blankRehearsal();if(raw===undefined)return out;
 const fail=m=>{throw new Error('Rehearsal: '+m);};
 const object=v=>{if(!v||typeof v!=='object'||Array.isArray(v))fail('expected an object.');return v;};
 const text=(v,max=5000)=>{if(v===undefined)return '';if(typeof v!=='string'||v.length>max)fail('invalid text.');return v;};
 const date=v=>{v=text(v,10);if(v&&!validDate(v))fail('invalid date.');return v;};
 const bool=v=>{if(v===undefined)return false;if(typeof v!=='boolean')fail('invalid flag.');return v;};
 const num=(v,min,max,step=1)=>{if(typeof v!=='number'||!Number.isFinite(v)||v<min||v>max||Math.abs(v/step-Math.round(v/step))>1e-8)fail('invalid numerical control.');return v;};
 object(raw);for(const k of Object.keys(raw))if(!Object.hasOwn(out,k))fail('unknown section.');
 const u=object(raw.uncertainty??out.uncertainty);out.uncertainty={n:num(u.n??50,10,500),sd:num(u.sd??8,1,30),effect:num(u.effect??2,-10,10,.5),level:num(u.level??95,90,99),threshold:num(u.threshold??3,0,20,.5),seed:num(u.seed??1,1,1000000)};if(![90,95,99].includes(out.uncertainty.level))fail('unknown confidence level.');
 out.lastBackupOn=date(raw.lastBackupOn);
 for(const kind of ['calibration','changes','briefings','retrieval'])for(const [id,r] of Object.entries(object(raw[kind]??{}))){object(r);const v={date:date(r.date)};
  if(kind==='calibration'){if(!Object.hasOwn(QUESTION_BY_ID,id)||!['low','medium','high'].includes(r.certainty)||typeof r.choice!=='boolean'||!v.date)fail('invalid confidence record.');v.certainty=r.certainty;v.choice=r.choice;}
  if(kind==='changes'){const c=REHEARSAL.changes.find(x=>x.id===id);if(!c)fail('unknown changed case.');v.choice=text(r.choice,100);if(v.choice&&!c.choices.some(x=>x.id===v.choice))fail('unknown changed-case choice.');v.reason=text(r.reason,3000);v.revealed=bool(r.revealed);if(v.revealed&&(!v.choice||!v.reason.trim()||!v.date))fail('revealed comparison needs a response.');}
  if(kind==='briefings'){if(!REHEARSAL.briefings.some(c=>REHEARSAL.audiences.some(a=>id===c.id+'-'+a.id)))fail('unknown briefing.');for(const f of ['question','finding','uncertainty','action'])v[f]=text(r[f],3000);v.reference=text(r.reference,500);v.exampleOpen=bool(r.exampleOpen);}
  if(kind==='retrieval'){if(!IDS.includes(id))fail('unknown retrieval topic.');v.evidenceId=text(r.evidenceId,100);if(v.evidenceId&&!/^[A-Za-z0-9_-]+$/.test(v.evidenceId))fail('invalid evidence reference identifier.');for(const f of ['support','contribution','limitations','gap'])v[f]=text(r[f],3000);v.revealed=bool(r.revealed);if(v.revealed&&(!v.date||(v.evidenceId?['support','contribution','limitations'].some(f=>!v[f].trim()):!v.gap.trim())))fail('revealed retrieval needs an explanation or gap.');}
  out[kind][id]=v;
 }
 return out;
}
function rehearsalCards() { return `<div class="tool-cards reasoning-cards">${[['uncertainty','Explore statistical uncertainty','Change sample size, variation and effect; inspect intervals and repeated samples.'],['calibration','Compare confidence with accuracy','Find confident mistakes and correct answers you were unsure about.'],['changes','What changes if…?','Reconsider an approach when one important assumption changes.'],['briefing','Build a stakeholder briefing','Adapt findings, uncertainty and action for two different audiences.'],['retrieval','Rehearse your evidence','Recall a relevant reference and explain your contribution and its limits.']].map(([id,title,description])=>`<a href="#${id}"><h3>${title}</h3><p>${description}</p><span>Open activity →</span></a>`).join('')}</div>`; }
function erfcApprox(x) { const z=Math.abs(x),t=1/(1+z/2),value=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(.37409196+t*(.09678418+t*(-.18628806+t*(.27886807+t*(-1.13520398+t*(1.48851587+t*(-.82215223+t*.17087277)))))))));return x>=0?Math.min(1,value):2-value; }
function uncertaintyValues(u=state.rehearsal.uncertainty) { const critical={90:1.6448536269514722,95:1.959963984540054,99:2.5758293035489004}[u.level],se=u.sd*Math.sqrt(2/u.n),margin=critical*se,p=erfcApprox(Math.abs(u.effect/se)/Math.SQRT2);return {critical,se,margin,lower:u.effect-margin,upper:u.effect+margin,p,alpha:1-u.level/100}; }
function simulatedIntervals(u=state.rehearsal.uncertainty) { let seed=u.seed;const uniform=()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return (seed+.5)/4294967296;},v=uncertaintyValues(u);return Array.from({length:100},(_,i)=>{const z=Math.sqrt(-2*Math.log(uniform()))*Math.cos(2*Math.PI*uniform()),estimate=u.effect+v.se*z,lower=estimate-v.margin,upper=estimate+v.margin;return {sample:i+1,estimate,lower,upper,covers:lower<=u.effect&&upper>=u.effect};}); }
function uncertaintyChart(rows,u) { const all=[0,u.effect,...rows.flatMap(r=>[r.lower,r.upper])],min=Math.min(...all)-1,max=Math.max(...all)+1,x=n=>65+(n-min)/(max-min)*430;return `<svg viewBox="0 0 540 620" class="uncertainty-chart" role="img" aria-labelledby="interval-title interval-desc"><title id="interval-title">First 20 simulated intervals</title><desc id="interval-desc">The dashed vertical line is the known simulation truth. Cross marks identify intervals that miss it. Exact values for all 100 samples are in the table below.</desc><path d="M${x(u.effect)} 30V560" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/><g fill="var(--muted)" font-size="13"><text x="10" y="18">Sample</text><text x="65" y="600">${min.toFixed(1)} days</text><text x="495" y="600" text-anchor="end">${max.toFixed(1)} days</text></g>${rows.slice(0,20).map((r,i)=>{const y=40+i*26;return `<g stroke="${r.covers?'var(--positive)':'var(--ink)'}" fill="${r.covers?'var(--positive)':'var(--ink)'}"><text x="10" y="${y+4}" stroke="none" font-size="12">${r.sample}${r.covers?'':' ×'}</text><path d="M${x(r.lower)} ${y}H${x(r.upper)}" stroke-width="2"/><circle cx="${x(r.estimate)}" cy="${y}" r="3"/></g>`;}).join('')}</svg>`; }
function uncertaintyResults() {
 const u=state.rehearsal.uncertainty,v=uncertaintyValues(u),rows=simulatedIntervals(u),covered=rows.filter(r=>r.covers).length;
 const practical=v.lower>u.threshold?'The entire interval exceeds the chosen useful reduction.':v.upper<u.threshold?'The interval does not reach the chosen useful reduction.':'The interval includes reductions below and above the chosen useful reduction.';
 return `<div class="lab-metrics uncertainty-metrics"><div><strong data-stat="se">${v.se.toFixed(3)}</strong><span>Standard error · days</span></div><div><strong data-stat="lower">${v.lower.toFixed(3)}</strong><span>Interval lower · days</span></div><div><strong data-stat="upper">${v.upper.toFixed(3)}</strong><span>Interval upper · days</span></div></div><p><strong>Two-sided p-value:</strong> <span data-stat="p">${v.p<.000001?'< 0.000001':v.p.toFixed(6)}</span>. At α = ${v.alpha.toFixed(2)}, ${v.p<v.alpha?'reject':'do not reject'} the null of zero difference under this model.</p><div class="note"><p><strong>Practical meaning:</strong> ${practical} The threshold is ${u.threshold} days; costs, harms and feasibility still matter.</p></div><p class="small muted">SE = σ√(2/n); interval = estimated difference ± z × SE. σ is known and equal in this teaching model. A real analysis usually estimates variability and may require a t-based or other method. Positive values mean shorter waits; negative values mean longer waits.</p><h3>What repeated sampling means</h3><p>For this simulation, treat the chosen difference (${u.effect} days) as the population truth. Each new sample estimate varies around it. <strong data-stat="coverage">${covered} of 100</strong> ${u.level}% intervals contain that truth.</p><p class="small muted">The percentage describes a procedure over repeated samples. It is not the probability that a fixed true value lies inside this one computed interval. The same random draws are reused when comparing settings; generate another set to explore variation in coverage.</p><button class="button secondary small" data-action="resample-intervals">Generate another 100 samples</button><figure>${uncertaintyChart(rows,u)}<figcaption>First 20 samples · dashed line = simulation truth · × = interval misses truth. Point = sample estimate. All 100 values are available below.</figcaption></figure><details><summary>Exact values for all 100 intervals</summary><div class="table-scroll"><table><caption>Simulated differences and interval endpoints, in days</caption><thead><tr><th>Sample</th><th>Estimate</th><th>Lower</th><th>Upper</th><th>Contains truth?</th></tr></thead><tbody>${rows.map(r=>`<tr><th>${r.sample}</th><td>${r.estimate.toFixed(4)}</td><td>${r.lower.toFixed(4)}</td><td>${r.upper.toFixed(4)}</td><td>${r.covers?'Yes':'No'}</td></tr>`).join('')}</tbody></table></div></details>`;
}
function renderUncertainty() { const u=state.rehearsal.uncertainty;return `${practiceNav('uncertainty')}${heading('See uncertainty change.','Explore a deliberately simple comparison of two independent group means.')}${activityKsbLinks(['K13','S10'])}<div class="note"><p>Teaching assumptions: independent observations, two normal populations, equal known standard deviation and equal sample size per group. This lab isolates sampling uncertainty; it does not model bias, confounding or missing data.</p></div><div class="uncertainty-layout"><section class="panel"><h2>Set the comparison</h2>${[['n','People in each group',10,500,1],['sd','Known population standard deviation (days)',1,30,1],['effect','Estimated reduction / simulation truth (days)',-10,10,.5],['threshold','Smallest useful reduction (days)',0,20,.5]].map(([key,label,min,max,step])=>`<div class="field"><label for="uncertainty-${key}">${label}: <output id="uncertainty-${key}-value">${u[key]}</output></label><input type="range" id="uncertainty-${key}" data-uncertainty="${key}" min="${min}" max="${max}" step="${step}" value="${u[key]}"></div>`).join('')}${selectField('Confidence level','uncertainty-level',{90:'90%',95:'95%',99:'99%'},u.level,'data-uncertainty="level"')}<button class="text-button" data-action="reset-uncertainty">Reset the lab</button><p class="small muted">Try a tiny effect with a large sample. Then decide whether statistical significance would justify a useful action.</p></section><section class="panel" id="uncertainty-results">${uncertaintyResults()}</section></div>`; }
function updateUncertainty(el) { state.rehearsal.uncertainty[el.dataset.uncertainty]=Number(el.value);const output=document.getElementById(el.id+'-value');if(output)output.textContent=el.value;document.getElementById('uncertainty-results').innerHTML=uncertaintyResults();saveSoon(); }
function certaintyLabel(value) { return {low:'Unsure',medium:'Fairly confident',high:'Very confident'}[value]||'Not recorded'; }
function calibrationGroup(r,id) { const correct=r.choice===QUESTION_BY_ID[id].answer;return r.certainty==='high'&&!correct?'confident-error':r.certainty==='low'&&correct?'unsure-correct':correct?'correct':'review'; }
function renderCalibration() { const entries=Object.entries(state.rehearsal.calibration),shown=entries.filter(([id,r])=>!ui.calibrationFilter||calibrationGroup(r,id)===ui.calibrationFilter);return `${practiceNav('calibration')}${heading('Was your confidence well placed?','Compare certainty recorded before feedback with your latest rated answer to each question.')}<p>Use “How sure are you?” in the misconception quiz. Ratings are optional; unrated attempts are excluded. Repeating a question replaces its previous confidence comparison.</p><div class="button-row"><a class="button" href="#quiz">${state.learningTools.quizSession?'Resume misconception quiz':'Start a misconception quiz'}</a></div><section class="panel content-section"><h2>Your confidence groups</h2><div class="table-scroll"><table><caption>Latest rated answers only; these counts do not grade workplace competence</caption><thead><tr><th>Before feedback</th><th>Questions rated</th><th>Matched the key</th><th>Accuracy</th></tr></thead><tbody>${['high','medium','low'].map(level=>{const group=entries.filter(([,r])=>r.certainty===level),correct=group.filter(([id,r])=>r.choice===QUESTION_BY_ID[id].answer).length;return `<tr><th>${certaintyLabel(level)}</th><td>${group.length}</td><td>${correct}</td><td>${group.length?Math.round(correct/group.length*100)+'%':'No ratings'}</td></tr>`;}).join('')}</tbody></table></div></section><section class="content-section">${selectField('Which answers to revisit','calibration-filter',{'':'All rated questions','confident-error':'Confident mistakes','unsure-correct':'Correct but unsure',review:'Other mistakes',correct:'Other correct answers'},ui.calibrationFilter)}${shown.length?`<ul class="quiz-review-list">${shown.sort(([a,ra],[b,rb])=>(calibrationGroup(ra,a)==='confident-error'?-1:0)-(calibrationGroup(rb,b)==='confident-error'?-1:0)||a.localeCompare(b)).map(([id,r])=>`<li><div><strong>${id} · ${esc(QUESTION_BY_ID[id].statement)}</strong><p class="small muted">${certaintyLabel(r.certainty)} · ${r.choice===QUESTION_BY_ID[id].answer?'Matched the key':'Needs review'} · ${prettyDate(r.date)}</p></div><button class="text-button" data-action="calibration-revisit" data-id="${id}">Try again</button></li>`).join('')}</ul>`:'<div class="quiet-box"><h3>No answers in this group yet.</h3><p>Record certainty before checking a quiz answer, or select another group.</p></div>'}</section>`; }

function blankGame() { return {settings:{ends:[720,1020],reminders:['08:30','13:00','19:00'],celebrations:true,pins:[],pack:'quality'},events:[],deleted:[],active:null}; }
function gameContext(activity,target) {
 const single=(label,route,ksbs)=>({activity,target,block:G.kinds[activity],label,route,ksbs});
 if(['recall','workshop','retrieval'].includes(activity)&&IDS.includes(target))return single(`${target} · ${BY_ID[target].title}`,activity==='recall'?'practice':activity+'-'+target.toLowerCase(),[target]);
 const sources={repair:REASONING.repairs,method:REASONING.methods,scenario:ACTIVITIES.scenarios,change:REHEARSAL.changes,connection:REASONING.connections};
 if(Object.hasOwn(sources,activity)){const item=sources[activity].find(x=>x.id===target);if(item)return single(item.title,{repair:'repairs-',method:'methods-',scenario:'scenarios-',change:'changes-',connection:'connections-'}[activity]+target,item.ksbs);}
 if(activity==='lab'){if(target==='uncertainty')return single('Statistical uncertainty','uncertainty',['K13','S10']);const item=ACTIVITIES.labs.find(x=>x.id===target);if(item)return single(item.title,'labs-'+target,item.ksbs);}

 return null;
}

function renderGameSettings() {const s=state.game.settings;return `${heading('Make the rhythm fit your day.','Choose your check-in windows, reminder times and celebration preference.',`<a class="button secondary small" href="#today">Daily missions</a>`)}<section class="panel"><h2>Three check-in windows</h2><p>Windows cover your local calendar day. Completing a block in each window earns a three-check-in date. Window assignments are recorded when practice finishes; changing these settings applies to future completions.</p><form id="game-settings-form"><div class="two-fields">${field('First window ends','game-end-0',gameTime(s.ends[0]),'time','required')}${field('Second window ends','game-end-1',gameTime(s.ends[1]),'time','required')}</div><p class="small muted">First: 00:00–${gameTime(s.ends[0])}; second: ${gameTime(s.ends[0])}–${gameTime(s.ends[1])}; third: ${gameTime(s.ends[1])}–24:00. Boundaries belong to the next window.</p>${s.reminders.map((value,i)=>field(['Recall reminder','Apply reminder','Explain reminder'][i],'game-reminder-'+i,value,'time','required')).join('')}<label class="check-label"><input id="game-celebrations" type="checkbox"${s.celebrations?' checked':''}>Show a short celebration when I earn a new badge</label><p id="game-settings-error" class="error-text" role="alert" tabindex="-1"></p><button class="button" type="submit">Save my rhythm</button></form><div class="button-row"><button class="button secondary" data-action="game-calendar">Download three daily calendar reminders</button></div><p class="small muted">Save changes before downloading. Import the .ics file into your calendar to enable its reminders. The file uses your calendar’s local time and does not contain study notes. It schedules reminders for the next 90 days; the page itself does not send background notifications.</p></section><section class="panel content-section"><h2>How practice XP works</h2><p>The first completed Recall, Apply and Explain block on a local date earns 20 XP each. Completing all three adds 40 XP, for a daily maximum of 100 XP. Further practice contributes to history, check-ins and relevant milestones. Incorrect answers can earn practice XP after feedback and self-review.</p><p>Streaks use consecutive local dates with completed blocks. Today can still be completed while yesterday’s streak remains current. Your best run and earlier earned milestones stay visible after a missed date.</p><p>Records, preferences and deletions are included in your normal JSON backup. Rewards describe self-recorded practice; Readiness continues to show recall, personal examples and evidence.</p><button class="button secondary small" data-action="backup">Back up my progress</button></section>`;}
function saveGameSettings() {const ends=[0,1].map(i=>G.timeValue(document.getElementById('game-end-'+i).value)),reminders=[0,1,2].map(i=>document.getElementById('game-reminder-'+i).value),error=document.getElementById('game-settings-error');if(ends.some(x=>x===null||x===0)||ends[0]>=ends[1]||reminders.some((r,i)=>G.timeValue(r)===null||G.windowAt(G.timeValue(r),ends)!==i)){error.textContent='Use two increasing window boundaries and one reminder inside each window.';error.focus();return;}state.game.settings.ends=ends;state.game.settings.reminders=reminders;state.game.settings.celebrations=document.getElementById('game-celebrations').checked;save();render();toast('Your rhythm is saved. Earlier check-ins keep their recorded windows.');}
function gameCalendar() {const now=new Date(),utc=now.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//L4 Fellowship//Practice reminders//EN','CALSCALE:GREGORIAN'];state.game.settings.reminders.forEach((time,i)=>{const minute=G.timeValue(time),date=G.stamp(Date.now()).minute>minute?addDays(1):localDate(),start=date.replace(/-/g,'')+'T'+time.replace(':','')+'00',name=['Recall','Apply','Explain'][i];lines.push('BEGIN:VEVENT','UID:l4-fellowship-'+name.toLowerCase()+'@practice.local','DTSTAMP:'+utc,'DTSTART:'+start,'DURATION:PT5M','RRULE:FREQ=DAILY;COUNT=90','SUMMARY:Data Fellowship - '+name,'DESCRIPTION:Open your study desk and complete a small '+name.toLowerCase()+' practice block.','URL:https://nikolaspanayotov-jpg.github.io/VibeProjects/L4-fellowship/#today','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Data Fellowship '+name+' reminder','END:VALARM','END:VEVENT');});lines.push('END:VCALENDAR');download('l4-fellowship-practice-reminders.ics',lines.map(line=>(line.match(/.{1,74}/g)||['']).join('\r\n ')).join('\r\n')+'\r\n','text/calendar');}
function gameWeeklyChallenge() {if(state.session){toast('Your unfinished practice is saved. Finish or end it before starting the weekly rehearsal.');go('practice');return;}ui.practiceMode='mixed';ui.mixed=['K','S','B'].map(prefix=>{const candidates=IDS.filter(id=>id[0]===prefix),rank=id=>state.ksbs[id].nextReview&&state.ksbs[id].nextReview<=localDate()?0:state.ksbs[id].recall==='help'?1:state.ksbs[id].recall==='partial'?2:state.ksbs[id].recall==='none'?3:4;return candidates.sort((a,b)=>rank(a)-rank(b))[0];});ui.timer=false;go('practice');startPractice();state.session.gameChallenge=true;state.session.gameAttemptIds=[];save();render(true);}
function gameDownloadRecap() {const m=gameStats(),dates=Array.from({length:7},(_,i)=>addDays(i,ui.gameWeek)),lines=['# My Data Fellowship practice week','Week of '+ui.gameWeek,'','Self-recorded practice; assess readiness separately.','',...dates.map(d=>{const day=m.days[d];return `${d}: ${day?.types.map(b=>G.blocks[b].name).join(', ')||'No completed blocks'}; ${day?.xp||0} XP; ${day?.windows.length||0}/3 check-in windows.`;}),'','## Completed practice',...gameWeekEvents().filter(e=>G.kinds[e.kind]||e.kind==='challenge').flatMap(e=>['### '+e.date+' · '+gameLabel(e),e.reflection||'Recall reviewed.',''])];download('l4-practice-week-'+ui.gameWeek+'.md',lines.join('\n'),'text/markdown');}
function gameWeeklyCard() {const m=gameStats(),dates=Array.from({length:7},(_,i)=>addDays(i,ui.gameWeek)),xp=dates.reduce((n,d)=>n+(m.days[d]?.xp||0),0),active=dates.filter(d=>m.days[d]).length,trios=dates.filter(d=>m.days[d]?.types.length===3).length,svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"><rect width="640" height="420" rx="18" fill="#F2F5F8"/><g font-family="Arial,sans-serif" fill="#172A3A"><text x="32" y="48" font-size="26">My Data Fellowship practice week</text><text x="32" y="80" font-size="16" fill="#4B5D6B">Week of ${prettyDate(ui.gameWeek)}</text><text x="32" y="127" font-size="25">${xp} XP</text><text x="235" y="127" font-size="25">${active} active dates</text><text x="460" y="127" font-size="25">${trios} trios</text>${dates.map((d,i)=>{const value=m.days[d]?.xp||0,x=42+i*83;return `<rect x="${x}" y="${335-value*1.4}" width="45" height="${value*1.4}" fill="#174EA6"/><text x="${x+22}" y="${value?325-value*1.4:320}" text-anchor="middle" font-size="14">${value}</text><text x="${x+22}" y="363" text-anchor="middle" font-size="14">${dateObject(d).toLocaleDateString('en-GB',{weekday:'short'})}</text>`;}).join('')}<text x="32" y="400" font-size="13" fill="#4B5D6B">Self-recorded practice milestones</text></g></svg>`;download('l4-practice-card-'+ui.gameWeek+'.svg',svg,'image/svg+xml');}
function gameDownloadBadge(id) {const b=G.badges.find(x=>x.id===id),earned=gameStats().earned[id];if(!earned)return;const art=G.badgeArt(b.art).replace('<svg ', '<svg x="248" y="35" width="144" height="144" '),svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" rx="20" fill="#F2F5F8"/>${art}<text x="320" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#172A3A">${b.name}</text><text x="320" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#4B5D6B">Earned ${earned.date} · Data Fellowship practice</text><text x="320" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#4B5D6B">A personal practice milestone</text></svg>`;download('l4-badge-'+id+'.svg',svg,'image/svg+xml');}
function gameSummary() {const m=gameStats();return ['','## Daily practice and rewards',`${m.total} XP; ${m.current}-day current study streak; best ${m.counts.best}.`,`${m.counts.trios} daily trios; ${m.counts.checkins} three-check-in dates.`,...G.badges.filter(b=>m.earned[b.id]).map(b=>`- ${b.name}: ${m.earned[b.id].date}`),'',...m.events.flatMap(e=>['### '+e.date+' · '+gameLabel(e),e.reflection||'Reviewed practice.',`Recorded window: ${e.window+1}.`,''])];}
function gameClick(action,button) {
 if(action==='study'&&button.dataset.gameBlock||action==='game-mission'){startGameContext(gameMission(button.dataset.gameBlock));return true;}
 if(action==='game-track'){const ctx=gameCurrentContext();if(ctx)startGameContext(ctx,false);return true;}
 if(action==='game-open-finish'){openGameFinish();return true;}
 if(action==='game-close-finish'){captureGameFinish();save();document.getElementById('game-finish-dialog').close();document.querySelector('[data-action="game-open-finish"]')?.focus();return true;}
 if(action==='game-dismiss-receipt'){ui.gameReceipt=null;render();return true;}
 if(action==='game-badge'){openGameBadge(button.dataset.id);return true;}
 if(action==='game-close-detail'){document.getElementById('game-detail-dialog').close();return true;}
 if(action==='game-pin'){const id=button.dataset.id,pins=state.game.settings.pins;if(pins.includes(id))state.game.settings.pins=pins.filter(x=>x!==id);else if(pins.length<3&&gameStats().earned[id])pins.push(id);else{toast('Choose up to three earned badges. Unpin one to make room.');return true;}save();document.getElementById('game-detail-dialog').close();render();openGameBadge(id);return true;}
 if(action==='game-download-badge'){gameDownloadBadge(button.dataset.id);return true;}
 if(action==='game-open-day'){document.getElementById('game-detail-dialog').close();ui.gameDay=button.dataset.date;ui.gameWeek=G.weekOf(ui.gameDay);go('habits');return true;}
 if(action==='game-select-pack'){state.game.settings.pack=button.dataset.id;save();render();return true;}
 if(action==='game-quest-step'){const ctx=gameContext(button.dataset.kind,button.dataset.target);if(ctx)startGameContext(ctx);return true;}
 if(action==='game-weekly-challenge'){gameWeeklyChallenge();return true;}
 if(action==='game-filter-day'){stopGameReplay();ui.gameDay=button.dataset.date;render();return true;}
 if(action==='game-clear-day'){ui.gameDay='';render();return true;}
 if(action==='game-delete-event'){const e=state.game.events.find(e=>e.id===button.dataset.id);if(!e||!confirm('Remove this practice record? XP, streaks, check-ins and related rewards will be recalculated. Your KSB answers and evidence stay saved.'))return true;stopGameReplay();ui.gameUndo=clone(e);state.game.events=state.game.events.filter(x=>x.id!==e.id);state.game.deleted.push(e.id);save();render();return true;}
 if(action==='game-undo-delete'){const e=ui.gameUndo;if(e){state.game.deleted=state.game.deleted.filter(id=>id!==e.id);if(!state.game.events.some(x=>x.id===e.id))state.game.events.push(e);ui.gameUndo=null;save();render();}return true;}
 if(action==='game-calendar'){gameCalendar();return true;}
 if(action==='game-weekly-card'){gameWeeklyCard();return true;}
 if(action==='game-download-recap'){gameDownloadRecap();return true;}
 if(action==='game-replay-prev'||action==='game-replay-next'){stopGameReplay();const count=gameWeekEvents().filter(e=>G.kinds[e.kind]||e.kind==='challenge').length;ui.gameReplayIndex=Math.max(0,Math.min(count-1,ui.gameReplayIndex+(action.endsWith('next')?1:-1)));updateGameReplay();return true;}
 if(action==='game-replay-toggle'){if(gameReplayTimer){stopGameReplay();updateGameReplay();return true;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('Use Previous, Next or the position slider with reduced motion.');return true;}const count=gameWeekEvents().filter(e=>G.kinds[e.kind]||e.kind==='challenge').length;if(ui.gameReplayIndex>=count-1)ui.gameReplayIndex=0;gameReplayTimer=setInterval(()=>{if(document.hidden||route().view!=='habits'){stopGameReplay();return;}if(ui.gameReplayIndex>=count-1)stopGameReplay();else ui.gameReplayIndex++;updateGameReplay();},3000);updateGameReplay();return true;}
 return false;
}

  if(action==='pause-practice'){pauseTimer();go('today');return;}
  if(action==='end-practice'){if(!confirm('End this unfinished session? Previously recorded attempts stay in your history.'))return;state.session=null;save();render();return;}
  if(action==='toggle-timer'){if(state.session.running)pauseTimer();else{state.session.startedAt=Date.now();state.session.running=true;save();}button.textContent=state.session.running?'Pause':'Resume';updateTimer();return;}
  if(action==='reset-timer'){state.session.remaining=state.session.duration*60;state.session.startedAt=state.session.running?Date.now():null;save();document.getElementById('timer-finished').hidden=true;updateTimer();return;}
  if(action==='rate-practice'){const s=state.session,q=s.queue[s.index],result=button.dataset.result;recordRecall(q.id,result,s.nextDate);state.ksbs[q.id].gap=s.gap||state.ksbs[q.id].gap;state.attempts.push({id:uid(),ksb:q.id,date:localDate(),question:practiceQuestion(q),response:s.response,gap:s.gap,result,nextReview:state.ksbs[q.id].nextReview});const gameAttempt=gameRecordRecall(state.attempts.at(-1));if(s.gameChallenge&&gameAttempt){s.gameAttemptIds||=[];s.gameAttemptIds.push(gameAttempt);}if(s.index+1<s.queue.length){s.index++;s.response='';s.gap='';s.nextDate='';s.revealed=false;}else{if(s.gameChallenge&&s.gameAttemptIds?.length===3)gameEvent('challenge','mixed',s.gameAttemptIds[0],'Completed a mixed Knowledge, Skill and Behaviour rehearsal.',{attemptIds:[...s.gameAttemptIds]});state.session=null;ui.practiceCompleted=true;}save();render(true);toast('Recall recorded.');return;}
  if(action==='use-practice-response'){const s=state.session,id=s.queue[s.index].id;if(!s.response.trim()){toast('Write a response first, or record your spoken answer in the topic view.');return;}if(state.ksbs[id].response&&!confirm('Replace this topic’s existing personal response with the current practice response?'))return;state.ksbs[id].response=s.response;state.ksbs[id].exampleConfirmed=false;save();toast('Practice response copied to your personal answer.');return;}
  if(action==='copy-code'){const pre=button.parentElement.querySelector('pre');try{await navigator.clipboard.writeText(pre.textContent);toast('Code copied.');}catch(error){const selection=window.getSelection(),range=document.createRange();range.selectNodeContents(pre);selection.removeAllRanges();selection.addRange(range);toast('Code selected. Use your device’s Copy command.');}return;}
  if(action==='download-dataset'){csvDownload(button.dataset.dataset);return;}
  if(action==='apply-restore'){applyRestore();return;}
  if(action==='cancel-restore'){document.getElementById('restore-dialog').close();ui.restore=null;return;}
  if(action==='clear-data'){if(!confirm('Clear all personal responses, evidence, practice history, settings and drafts on this device? Download a backup first if you want to keep them.'))return;try{localStorage.removeItem(STORAGE_KEY);state=defaults();storageWritable=true;storageMessage='';recoveryRaw=null;ui.evidenceDraft=null;save();render();toast('Personal data cleared on this device.');}catch(error){toast('Device storage could not be cleared. Your current data is unchanged.');}return;}
});
document.addEventListener('input',event=>{const el=event.target;
  if(el.closest('#game-finish-form')){captureGameFinish();return;}
  if(el.id==='game-replay-position'){stopGameReplay();ui.gameReplayIndex=Number(el.value);updateGameReplay();return;}
  gameTouch();
  if(captureRehearsalInput(el))return;
  if(captureStudyInput(el))return;
  if(el.dataset.lab&&el.type==='range'){updateLab(el);return;}
  if(el.closest('#scenario-form')){captureScenario();return;}
  if(el.closest('#quiz-form')){captureQuiz();return;}
  if(el.id==='library-search'){ui.filters.q=el.value;document.getElementById('library-results').innerHTML=renderResults();return;}
  if(el.dataset.ksbField){const record=state.ksbs[el.dataset.id];record[el.dataset.ksbField]=el.value;if(el.dataset.ksbField==='response'){record.exampleConfirmed=false;const checkbox=mainEl.querySelector('[data-example-confirmed]');if(checkbox){checkbox.checked=false;checkbox.disabled=!el.value.trim();}}saveSoon();return;}
  if(el.dataset.stakeholder!==undefined){state.ksbs.S12.stakeholders[Number(el.dataset.stakeholder)][el.dataset.personField]=el.value;saveSoon();return;}
  if(el.dataset.forecastField){state.ksbs.S13.forecast[el.dataset.forecastField]=el.value;saveSoon();return;}
  if(el.closest('#evidence-form')){captureEvidence();return;}
  if(state.session&&el.id==='practice-response'){state.session.response=el.value;saveSoon();return;}
  if(state.session&&el.id==='practice-gap'){state.session.gap=el.value;saveSoon();return;}
  if(state.session&&el.id==='practice-review-date'){state.session.nextDate=el.value;saveSoon();}
});
document.addEventListener('change',event=>{const el=event.target;
  if(el.closest('#game-finish-form')){captureGameFinish();return;}
  if(el.id==='game-badge-filter'){ui.gameBadgeFilter=el.value;render();return;}
  if(el.id==='game-week'){if(validDate(el.value)){ui.gameWeek=G.weekOf(el.value);ui.gameDay='';ui.gameReplayIndex=0;render();}return;}
  gameTouch();
  if(captureRehearsalInput(el))return;
  if(el.id==='practice-activity'){go(el.value);return;}
  if(el.id==='calibration-filter'){ui.calibrationFilter=el.value;render();return;}
  if(el.id==='briefing-case'||el.id==='briefing-audience'){if(el.id==='briefing-case')ui.briefingCase=el.value;else ui.briefingAudience=el.value;render();return;}
  if(el.id==='retrieval-ksb'){go('retrieval-'+el.value.toLowerCase());return;}
  if(captureStudyInput(el))return;
  if(el.id==='workshop-ksb'){go('workshop-'+el.value.toLowerCase());return;}
  if(el.id==='connection-filter'){ui.connectionFilter=el.value;ui.connectionId=REASONING.connections.find(x=>!el.value||x.ksbs.includes(el.value)).id;go('connections-'+ui.connectionId);return;}
  if(el.id==='mobile-section'){go(el.value);return;}
  if(el.dataset.lab){updateLab(el);return;}
  if(el.id==='quiz-mode'){ui.quizMode=el.value;render();return;}
  if(el.id==='quiz-theme'){ui.quizTheme=el.value;render();return;}
  if(el.id==='quiz-ksb'){ui.quizKsb=el.value;render();return;}
  if(el.id==='quiz-length'){ui.quizLength=Number(el.value);return;}
  if(el.dataset.exampleConfirmed){const record=state.ksbs[el.dataset.exampleConfirmed];record.exampleConfirmed=!!el.checked&&!!record.response.trim();saveSoon();return;}
  if(el.id==='readiness-category'||el.id==='readiness-gap'){if(el.id==='readiness-category')ui.readyCategory=el.value;else ui.readyGap=el.value;document.getElementById('readiness-results').innerHTML=readinessResults();return;}
  if(el.id==='project-ksb'){ui.projectHighlight=el.value;if(el.value){ui.projectFocus=true;go('project-'+C.project.mapping[el.value][0].stage);}return;}
  if(el.id.startsWith('filter-')){const key=el.id.slice(7);ui.filters[key]=key==='due'?el.checked:el.value;document.getElementById('library-results').innerHTML=renderResults();return;}
  if(el.dataset.coverage){const id=el.dataset.coverage;state.ksbs[id].coverage[el.dataset.target]=el.value;state.ksbs[id].reviewedRevision=BY_ID[id].revision;saveSoon();return;}
  if(el.id==='evidence-filter'){ui.evidenceFilter=el.value;render();return;}
  if(el.name==='ev-ksbs'){captureEvidence();document.getElementById('evidence-rationales').innerHTML=evidenceRationales(ui.evidenceDraft);return;}
  if(el.id==='ev-status'){captureEvidence();document.getElementById('evidence-review-fields').hidden=el.value!=='reviewed';return;}
  if(el.id==='practice-mode'){ui.practiceMode=el.value;render();return;}
  if(el.id==='practice-topic'){ui.practiceId=el.value;render();return;}
  if(el.id.startsWith('mixed-')){ui.mixed[Number(el.id.slice(6))]=el.value;render();return;}
  if(el.id==='practice-duration'){ui.duration=Number(el.value);return;}
  if(el.id==='practice-timer'){ui.timer=el.checked;return;}
  if(el.id==='backup-file'){readBackup(el.files[0]);return;}
  if(el.id==='restore-mode'){ui.restore.mode=el.value;renderRestore();return;}
  if(el.dataset.restoreConflict){ui.restore.choices[el.dataset.restoreConflict]=el.value;}
});
document.addEventListener('submit',event=>{if(event.target.id==='game-finish-form'){event.preventDefault();finishGameBlock();return;}if(event.target.id==='game-settings-form'){event.preventDefault();saveGameSettings();return;}gameTouch();if(event.target.id==='changed-case-form'){event.preventDefault();submitChangedCase();return;}if(event.target.id==='retrieval-form'){event.preventDefault();submitRetrieval();return;}if(event.target.id==='briefing-form'){event.preventDefault();captureBriefing();save();toast(storageWritable?'Briefing saved on this device.':'Briefing kept in temporary memory. Export a backup.');return;}if(event.target.id==='reasoning-form'){event.preventDefault();submitReasoning();return;}if(event.target.id==='organisation-form'){event.preventDefault();captureOrganisation();save();toast(storageWritable?'Organisation note saved on this device.':'Organisation note kept in temporary memory; export a backup.');return;}if(event.target.id==='scenario-form'){event.preventDefault();submitScenario();return;}if(event.target.id==='quiz-form'){event.preventDefault();submitQuiz();return;}if(event.target.id==='evidence-form'){event.preventDefault();commitEvidence();return;}if(event.target.id==='plan-form'){event.preventDefault();const f=new FormData(event.target);state.settings.epaDate=String(f.get('plan-epa-date')||'');state.settings.standard=String(f.get('plan-standard')||'');state.settings.provider=String(f.get('plan-provider')||'');state.settings.assessmentOrg=String(f.get('plan-assessment')||'');state.settings.sessionLength=Number(f.get('plan-length'));state.settings.days=f.getAll('plan-days').map(Number);state.settings.ap03=document.getElementById('plan-ap03').checked;state.settings.priority=Array.from(document.getElementById('plan-priority').selectedOptions).map(o=>o.value);ui.duration=state.settings.sessionLength;save();render();toast(storageWritable?'Study plan saved on this device.':'Study plan kept in temporary memory.');}});
window.addEventListener('hashchange',()=>render(true));
window.addEventListener('beforeunload',save);
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue!==event.oldValue){storageWritable=false;storageMessage='Progress changed in another tab. This session is kept in temporary memory to avoid overwriting it. Export this session if needed, then reload to use the saved version.';updateStorageStatus();}});
window.addEventListener('focus',()=>{if(route().view==='today')render();updateTimer();});
window.addEventListener('afterprint',()=>mainEl.querySelectorAll('details[data-print-open]').forEach(d=>{d.open=d.dataset.printOpen==='yes';delete d.dataset.printOpen;}));
document.getElementById('restore-dialog').addEventListener('cancel',()=>ui.restore=null);
setInterval(updateTimer,1000);
render();
setupOffline();
})();
</script>
</body>
</html>
