  warningEl.innerHTML=storageWritable?'':`${esc(storageMessage)} <button class="text-button" data-action="backup">Export this session</button>${recoveryRaw?' · <button class="text-button" data-action="recover-original">Download original saved data</button>':''}`;

><details><summary>Self-check and reflection</summary><p>${task.check}</p><p class="small muted">What did you do independently? What needed help? What would you change? Keep this labelled as practice; it does not become workplace evidence automatically.</p></details></section>`).join('')}</div>`; }

function validateState(raw) {
  const fail=message=>{throw new Error(message);};
  const obj=(v,label)=>{if(!v||typeof v!=='object'||Array.isArray(v))fail(label+' must be an object.');return v;};
  const text=(v,label,max=20000)=>{if(v===undefined)return '';if(typeof v!=='string'||v.length>max)fail(label+' must be text of at most '+max+' characters.');return v;};
  const date=(v,label)=>{v=text(v,label,10);if(v&&!validDate(v))fail(label+' must be a valid YYYY-MM-DD date.');return v;};
  const enumeration=(v,allowed,label,fallback)=>{if(v===undefined)return fallback;if(!allowed.includes(v))fail('Invalid '+label+'.');return v;};
  const integer=(v,min,max,label)=>{if(!Number.isInteger(v)||v<min||v>max)fail('Invalid '+label+'.');return v;};
  const list=(v,label,max=1000)=>{if(!Array.isArray(v)||v.length>max)fail(label+' must be a bounded list.');return v;};
  const identity=(v,label)=>{v=text(v,label,100);if(!/^[A-Za-z0-9_-]{1,100}$/.test(v))fail('Invalid '+label+'.');return v;};
  const known=(id)=>{if(!IDS.includes(id))fail('Unknown KSB identifier: '+String(id).slice(0,30));return id;};
  const unique=(values,label)=>{if(new Set(values).size!==values.length)fail('Duplicate '+label+'.');return values;};
  obj(raw,'Backup');if(raw.version!==1)fail('Unsupported backup version. This page supports version 1; your existing data has not changed.');
  const output=defaults(),settings=obj(raw.settings||{},'Settings');
  for(const key of ['standard','provider','assessmentOrg'])output.settings[key]=text(settings[key],key,200);
  output.settings.epaDate=date(settings.epaDate,'Assessment date');
  if(settings.ap03!==undefined&&typeof settings.ap03!=='boolean')fail('AP03 setting must be true or false.');output.settings.ap03=!!settings.ap03;
  output.settings.days=unique(list(settings.days??output.settings.days,'Study days',7).map(n=>integer(n,0,6,'study day')),'study days');
  output.settings.sessionLength=enumeration(settings.sessionLength,[5,20,45],'session length',20);
  output.settings.textSize=enumeration(settings.textSize,['normal','large'],'text size','normal');
  output.settings.priority=unique(list(settings.priority||[],'Priority topics',37).map(known),'priority topics');
  obj(raw.ksbs,'KSB state');Object.keys(raw.ksbs).forEach(known);
  for(const id of IDS){const input=obj(raw.ksbs[id]||{},id),s=output.ksbs[id];s.learning=enumeration(input.learning,Object.keys(LEARNING),'learning state','new');s.recall=enumeration(input.recall,Object.keys(RECALL),'recall state','none');s.confidence=input.confidence===undefined?'':String(input.confidence);if(!['','1','2','3','4','5'].includes(s.confidence))fail('Invalid confidence for '+id);for(const key of ['response','gap'])s[key]=text(input[key],id+' '+key);if(input.exampleConfirmed!==undefined&&typeof input.exampleConfirmed!=='boolean')fail('Personal-example confirmation must be true or false.');s.exampleConfirmed=!!input.exampleConfirmed;if(s.exampleConfirmed&&!s.response.trim())fail('A confirmed personal example needs a response.');s.lastReview=date(input.lastReview,id+' last review');s.nextReview=date(input.nextReview,id+' next review');s.consecutive=integer(input.consecutive??0,0,1000000,'consecutive recalls');s.reviewedRevision=text(input.reviewedRevision,'Reviewed content revision',100);const coverage=obj(input.coverage||{},id+' coverage');for(const [key,value] of Object.entries(coverage)){if(!/^\d+$/.test(key)||Number(key)>=BY_ID[id].targets.length)fail('Unknown coverage target in '+id);s.coverage[key]=enumeration(value,Object.keys(COVERAGE),'answer coverage','unreviewed');}if(input.stakeholders!==undefined){const people=list(input.stakeholders,'Stakeholders',2);if(people.length!==2)fail('Two stakeholder slots are required.');s.stakeholders=people.map(p=>{obj(p,'Stakeholder');return Object.fromEntries(['role','need','channel','adaptation','outcome'].map(key=>[key,text(p[key],'Stakeholder '+key)]));});}if(input.forecast!==undefined){obj(input.forecast,'Forecast worksheet');s.forecast=Object.fromEntries(Object.keys(FORECAST_FIELDS).map(key=>[key,text(input.forecast[key],'Forecast '+key)]));}}
  function evidenceRecord(input,isDraft=false){obj(input,'Evidence');const e={id:identity(input.id,'evidence ID')};for(const key of ['title','project'])e[key]=text(input[key],key,200);e.reference=text(input.reference,'reference',500);for(const key of ['reflection','learning','reviewNote'])e[key]=text(input[key],key);e.date=date(input.date,'Evidence date');e.reviewDate=date(input.reviewDate,'Review date');e.status=enumeration(input.status,['draft','linked','reviewed'],'evidence state','draft');e.links=list(input.links||[],'Evidence links',37).map(link=>{obj(link,'Evidence link');return {id:known(link.id),rationale:text(link.rationale,'Evidence rationale')};});unique(e.links.map(l=>l.id),'evidence links');if(!isDraft&&(!e.title.trim()||!e.date))fail('Saved evidence needs a title and date.');if(!isDraft&&e.status!=='draft'&&(!e.reference.trim()||!e.links.length||e.links.some(l=>!l.rationale.trim())))fail('Linked evidence needs a reference and a rationale for every KSB.');if(!isDraft&&e.status==='reviewed'&&(!e.reviewNote.trim()||!e.reviewDate))fail('Reviewed evidence needs a note and date.');return e;}
  output.evidence=list(raw.evidence||[],'Evidence entries').map(e=>evidenceRecord(e));unique(output.evidence.map(e=>e.id),'evidence IDs');
  if(raw.evidenceDraft)output.evidenceDraft=evidenceRecord(raw.evidenceDraft,true);
  output.attempts=list(raw.attempts||[],'Practice attempts',5000).map(a=>{obj(a,'Attempt');const result={id:identity(a.id,'attempt ID'),ksb:known(a.ksb),date:date(a.date,'Attempt date'),question:text(a.question,'Question'),response:text(a.response,'Response'),gap:text(a.gap,'Gap'),result:enumeration(a.result,['help','partial','independent'],'attempt result','help'),nextReview:date(a.nextReview,'Next review')};if(!result.date)fail('Attempt date is missing.');return result;});unique(output.attempts.map(a=>a.id),'attempt IDs');
  if(raw.studySession){const s=obj(raw.studySession,'Study session');output.studySession={id:known(s.id),startedOn:date(s.startedOn,'Study start date')};}
  if(raw.session){const s=obj(raw.session,'Practice session'),queue=list(s.queue,'Question queue',37).map(q=>{obj(q,'Question');return {id:known(q.id),type:enumeration(q.type,['question','followup','project','probe'],'question type','question')};});if(!queue.length)fail('A practice session needs a question.');const duration=enumeration(s.duration,[5,20,45],'session duration',20),remaining=s.remaining;if(typeof remaining!=='number'||!Number.isFinite(remaining)||remaining<0||remaining>duration*60)fail('Invalid remaining time.');for(const key of ['running','timer','revealed'])if(typeof s[key]!=='boolean')fail('Invalid practice-session flag.');if(s.startedAt!==null&&(typeof s.startedAt!=='number'||!Number.isFinite(s.startedAt)||s.startedAt<0))fail('Invalid timer start.');if(s.running&&s.startedAt===null)fail('A running timer needs a start time.');output.session={queue,index:integer(s.index,0,queue.length-1,'question index'),response:text(s.response,'Practice response'),gap:text(s.gap,'Practice gap'),nextDate:date(s.nextDate,'Practice review date'),revealed:s.revealed,timer:s.timer,duration,remaining,startedAt:s.startedAt,running:s.running};}
  return output;
}
function same(a,b) { return JSON.stringify(a)===JSON.stringify(b); }
function mergeBackup(incoming,choices={}) { const merged=clone(state),conflicts=[],base=defaults();
  function decide(key,label,current,value,empty,assign){if(same(value,empty)||same(current,value))return;if(same(current,empty)){assign(clone(value));return;}conflicts.push({key,label});if(choices[key]==='import')assign(clone(value));}
  IDS.forEach(id=>decide('ksb-'+id,id+' personal response, progress and worksheet',state.ksbs[id],incoming.ksbs[id],base.ksbs[id],v=>merged.ksbs[id]=v));
  decide('settings','Study plan and settings',state.settings,incoming.settings,base.settings,v=>merged.settings=v);
  for(const field of ['session','studySession','evidenceDraft'])decide(field,{session:'Unfinished practice session',studySession:'Unfinished study session',evidenceDraft:'Unfinished evidence draft'}[field],state[field],incoming[field],null,v=>merged[field]=v);
  for(const field of ['evidence','attempts'])for(const record of incoming[field]){const i=merged[field].findIndex(r=>r.id===record.id);if(i<0)merged[field].push(clone(record));else if(!same(merged[field][i],record)){const key=field+'-'+record.id;conflicts.push({key,label:(field==='evidence'?'Evidence: '+record.title:'Practice attempt: '+record.ksb+' '+record.date)});if(choices[key]==='import')merged[field][i]=clone(record);}}
  return {merged,conflicts};
}
function renderRestore() { const r=ui.restore,dialog=document.getElementById('restore-dialog');if(!r)return;const preview=mergeBackup(r.incoming,r.choices),changed=IDS.filter(id=>!same(r.incoming.ksbs[id],emptyKsb())).length;
  document.getElementById('restore-content').innerHTML=`<h2 id="restore-heading">Preview your backup</h2><p class="small muted">${esc(r.name)} · Version 1</p><p>${changed} KSBs with personal state, ${r.incoming.evidence.length} evidence reflections and ${r.incoming.attempts.length} practice attempts.</p>${selectField('How to restore','restore-mode',{merge:'Merge with current progress',replace:'Replace current progress'},r.mode)}${r.mode==='merge'?`<div class="note">New records will be added. Current conflicting records are kept unless you explicitly choose the imported version.</div><p class="small">${preview.conflicts.length} conflicting record${preview.conflicts.length===1?'':'s'} found.</p><div class="conflicts">${preview.conflicts.map(c=>`<label class="conflict">${esc(c.label)}<select data-restore-conflict="${esc(c.key)}">${options({keep:'Keep current',import:'Use imported'},r.choices[c.key]||'keep')}</select></label>`).join('')}</div>`:'<div class="note warning">Replace removes current personal progress and replaces it with this backup.</div><label class="check-label"><input id="confirm-replace" type="checkbox">I understand that this replaces my current personal data.</label>'}<div class="button-row"><button class="button secondary" data-action="backup">Download current backup</button><button class="button" data-action="apply-restore">${r.mode==='merge'?'Merge backup':'Replace with backup'}</button><button class="text-button" data-action="cancel-restore">Cancel</button></div><p id="restore-error" class="error-text" role="alert"></p>`;if(!dialog.open)dialog.showModal(); }
async function readBackup(file) { if(!file)return;try{if(file.size>16*1024*1024)throw new Error('Choose a JSON backup smaller than 16 MB.');const incoming=validateState(JSON.parse(await file.text()));ui.restore={incoming,name:file.name,mode:'merge',choices:{}};renderRestore();}catch(error){toast('Backup not imported: '+(error instanceof SyntaxError?'the file is not valid JSON.':error.message));} }
function applyRestore() { const r=ui.restore;if(!r)return;const errorEl=document.getElementById('restore-error');if(r.mode==='replace'&&!document.getElementById('confirm-replace').checked){errorEl.textContent='Confirm replacement, or choose Merge to keep current conflicting records.';return;}try{const candidate=validateState(r.mode==='replace'?r.incoming:mergeBackup(r.incoming,r.choices).merged);localStorage.setItem(STORAGE_KEY,JSON.stringify(candidate));state=candidate;storageWritable=true;storageMessage='';recoveryRaw=null;ui.evidenceDraft=null;document.getElementById('restore-dialog').close();ui.restore=null;render();toast('Backup restored on this device.');}catch(error){errorEl.textContent='Restore could not be saved: '+error.message+' Existing progress is unchanged.';} }

function topicGaps(id) {
  const s=state.ksbs[id],due=!!s.nextReview&&s.nextReview<=localDate();
  return {recall:s.recall!=='independent'||!s.lastReview||due,example:!s.exampleConfirmed||!s.response.trim(),evidence:!['linked','reviewed'].includes(evidenceStatus(id)),due};
}
function nextGapAction(id) {
  const s=state.ksbs[id],g=topicGaps(id);
  if(g.due)return {id,type:'probe',priority:0,title:`Revisit ${id} with a probing question`,reason:`Your review was due ${prettyDate(s.nextReview)}.`,label:'Practise a probe'};
  if(s.recall==='help'||s.recall==='partial')return {id,type:'probe',priority:s.recall==='help'?1:2,title:`Strengthen your explanation of ${id}`,reason:`Your last recall was “${RECALL[s.recall]}”.${s.gap?' Your next-action note: '+s.gap.slice(0,180):''}`,label:'Practise a probe'};
  if(g.example&&(s.response.trim()||s.learning==='explain'||s.recall==='independent'))return {id,type:'example',priority:3,title:`Add or check your own example for ${id}`,reason:s.response.trim()?'A response is drafted, but a genuine personal example has not been self-checked.':'Connect the explanation to something you personally did.',label:'Write my example'};
  if(g.evidence&&(s.exampleConfirmed||s.learning==='explain'))return {id,type:'evidence',priority:4,title:`Link evidence for ${id}`,reason:evidenceStatus(id)==='draft'?'The reflection still needs an approved reference and a rationale.':'Add an approved evidence reference and explain how it supports this KSB.',label:'Link evidence'};
  if(g.recall&&s.learning!=='new')return {id,type:'probe',priority:5,title:`Test your recall of ${id}`,reason:'Reading or confidence alone does not show independent recall.',label:'Practise a probe'};
  if(s.learning==='new'&&s.recall==='none')return {id,type:'learn',priority:6,title:`Read the short explanation for ${id}`,reason:'Start with the 60-second explanation, then try it in your own words.',label:'Read the short answer'};
  if(g.example)return {id,type:'example',priority:7,title:`Make ${id} personal`,reason:'Prepare a genuine example and identify your own contribution.',label:'Write my example'};
  if(g.evidence)return {id,type:'evidence',priority:8,title:`Strengthen your evidence for ${id}`,reason:'Add a clear reference and a per-KSB rationale.',label:'Link evidence'};
  return {id,type:'probe',priority:20,title:`Keep ${id} fresh`,reason:'The current self-recorded gaps are filled. Revisit the explanation and check relevance with your provider.',label:'Practise a probe'};
}
function gapActions(limit=3) { return IDS.map(nextGapAction).filter(a=>a.priority<20).sort((a,b)=>a.priority-b.priority||IDS.indexOf(a.id)-IDS.indexOf(b.id)).slice(0,limit); }

function jumpLesson(step) { const targets={learn:'lesson-learn',example:'lesson-example',answer:'lesson-personal-answer',full:'lesson-full-guide'};if(step==='practice'){launchProbe(route().id,'quick');return;}const el=document.getElementById(targets[step]||targets.learn);if(!el)return;if(el.tagName==='DETAILS')el.open=true;const focusEl=step==='answer'?document.getElementById('my-response'):el.querySelector('summary,h2')||el;focusEl.setAttribute('tabindex','-1');focusEl.focus({preventScroll:true});el.scrollIntoView({block:'start',behavior:'instant'}); }
function launchProbe(id,mode='probe') { if(state.session){toast('Your unfinished practice session is saved. Finish or end it before starting a new topic.');go('practice');return;}ui.practiceId=id;ui.practiceMode=mode;ui.duration=state.settings.sessionLength;go('practice'); }
function projectData() { const rows=datasetRows('requests').slice(1),lookup=datasetRows('lookup').slice(1),comments=datasetRows('feedback').slice(1);const duration=row=>{const number=value=>{const [y,m,d]=value.split('-').map(Number);return Date.UTC(y,m-1,d)/86400000;};return number(row[3])-number(row[2]);};const durations=rows.filter(r=>r[3]).map(duration).sort((a,b)=>a-b);const services=Object.fromEntries(['S1','S2','S3','S4','S5','Other'].map(id=>[id,0]));rows.forEach(r=>services[Object.hasOwn(services,r[1])?r[1]:'Other']++);const themes={'Clear instructions':0,'Long wait':0,'Progress update needed':0,'Helpful response':0,'Unclear instructions':0};comments.forEach(r=>{const text=r[2].toLowerCase();if(text.includes('instructions were clear'))themes['Clear instructions']++;if(text.includes('wait'))themes['Long wait']++;if(text.includes('update'))themes['Progress update needed']++;if(text.includes('helpful')||text.includes('useful'))themes['Helpful response']++;if(text.includes('instructions were unclear'))themes['Unclear instructions']++;});return {requests:rows.length,completed:durations.length,open:rows.length-durations.length,median:(durations[134]+durations[135])/2,mean:durations.reduce((a,b)=>a+b,0)/durations.length,flawed:rows.reduce((sum,r)=>sum+Math.max(1,lookup.filter(l=>l[0]===r[1]).length),0),missing:rows.filter(r=>!r[1]).length,unmatched:rows.filter(r=>r[1]&&!lookup.some(l=>l[0]===r[1])).length,services,themes,comments:comments.length}; }
function projectDashboard() { const d=projectData(),qualitative=ui.projectChart==='feedback',values=qualitative?d.themes:Object.fromEntries(Object.entries(d.services).map(([id,n])=>[id==='Other'?'Missing / unmatched':'Service '+id.slice(1),n])),max=Math.max(...Object.values(values));return `<section class="case-dashboard" aria-label="Fictional project dashboard"><div class="section-heading"><h3>Illustrative service briefing</h3><span class="inline-badge">Synthetic data</span></div><div class="case-kpis"><div><strong>${d.requests}</strong><span>Requests</span></div><div><strong>${d.completed}</strong><span>Completed</span></div><div><strong>${d.open}</strong><span>Open cases</span></div><div><strong>${d.median}</strong><span>Median completed days</span></div></div><div class="segmented" role="group" aria-label="Dashboard view"><button data-action="project-chart" data-chart="requests" aria-pressed="${!qualitative}">Request measures</button><button data-action="project-chart" data-chart="feedback" aria-pressed="${qualitative}">Feedback themes</button></div><h4>${qualitative?'Themes in 36 fictional comments':'Requests by checked service label'}</h4><dl class="case-bars">${Object.entries(values).map(([label,n])=>`<div><dt>${esc(label)}</dt><dd><span class="bar-track" aria-hidden="true"><span style="width:${n/max*100}%"></span></span><strong>${n}</strong></dd></div>`).join('')}</dl><p class="small muted">${qualitative?'42 theme assignments across 36 comments; six comments have both waiting and helpfulness themes. This convenience sample is not representative satisfaction.':'The five service counts plus 12 missing/unmatched records reconcile to 300. Fixture patterns must not be used to rank real service performance.'}</p><details><summary>Exact values and definitions</summary><div class="table-scroll" tabindex="0" role="region" aria-label="Exact dashboard values"><table><thead><tr><th scope="col">${qualitative?'Theme':'Service label'}</th><th scope="col">Count</th></tr></thead><tbody>${Object.entries(values).map(([label,n])=>`<tr><th scope="row">${esc(label)}</th><td>${n}</td></tr>`).join('')}</tbody></table></div><p class="small">Completed-case median is ${d.median} calendar days; mean is ${d.mean.toFixed(4)}. Open cases are excluded from duration but reported separately. Monthly forecast data is a separate constructed series.</p></details></section>`; }
function projectJoinComparison() { const d=projectData(),flawed=ui.projectJoin==='flawed';return `<section class="join-comparison"><h3>See why the join matters</h3><div class="segmented" role="group" aria-label="Compare join results"><button data-action="project-join" data-join="flawed" aria-pressed="${flawed}">Flawed lookup</button><button data-action="project-join" data-join="approved" aria-pressed="${!flawed}">Approved lookup</button></div><p class="join-result" role="status"><strong>${flawed?d.flawed:d.requests}</strong> joined rows from ${d.requests} requests</p><p>${flawed?'S2 appears twice in the lookup: 57 requests each match two rows. The extra rows are a join artefact, not additional demand.':'The fictional source-owner decision supplies five canonical service labels. The request grain is restored, while four missing keys and eight non-null unmatched keys stay visible.'}</p><button class="button secondary small" data-action="approved-lookup">Download the fictional approved lookup</button></section>`; }
function renderProject() { const stage=C.project.stages.find(s=>s.id===ui.projectStage)||C.project.stages[0];return `${heading('Follow one complete project.','A fictional service-capacity briefing, from the initial question to an honest recommendation.',`<button class="button secondary small" data-action="download-project">Download example portfolio</button>`)}<div class="note warning">Everything in this case is illustrative: service, roles, decisions and feedback. The numbers are reproducible synthetic examples. Reading or downloading it never completes your personal evidence.</div><details class="project-overview"><summary>Project question and boundaries</summary><div class="prose">${C.project.overview}</div></details><nav class="project-timeline" aria-label="Worked project stages">${C.project.stages.map((s,i)=>`<button data-action="project-stage" data-stage="${s.id}"${s.id===stage.id?' aria-current="step"':''}><span aria-hidden="true">${i+1}</span>${s.title}</button>`).join('')}</nav><div class="project-tools">${selectField('Find an example for a KSB','project-ksb',{'':'Choose a KSB',...ksbOptions()},ui.projectHighlight)}<button class="text-button" data-action="project-map">See the full KSB map</button></div><section class="project-stage" data-project-stage="${stage.id}"><div class="stage-heading"><div class="eyeline">Stage ${C.project.stages.indexOf(stage)+1} of 6</div><h2>${stage.title}</h2><div class="prose">${stage.summary}</div></div>${stage.artifacts.map(a=>`<article class="project-artifact" id="artifact-${a.id}"><div class="section-heading"><h3><span class="artifact-id">${a.id}</span>${esc(a.title)}</h3></div><p class="muted">${esc(a.purpose)}</p>${a.id==='P03'?`<div id="project-join-panel">${projectJoinComparison()}</div>`:''}${a.id==='P07'?`<div id="project-dashboard">${projectDashboard()}</div>`:''}${a.id==='P05'?`<div class="forecast-example"></div>`:''}<details${ui.projectHighlight&&a.links.some(l=>l.id===ui.projectHighlight)?' open':''}><summary>Read the sample artefact</summary><div class="prose">${a.body}</div></details><details class="project-annotations" open><summary>Why this connects to the KSBs</summary><ul>${a.links.map(l=>`<li${l.id===ui.projectHighlight?' class="highlighted"':''}><a href="#ksb-${l.id.toLowerCase()}">${l.id}</a><span>${esc(l.rationale)}</span><button class="text-button small" data-action="project-personal-example" data-id="${l.id}">Write my own example</button></li>`).join('')}</ul></details></article>`).join('')}<div class="button-row stage-paging">${C.project.stages.indexOf(stage)>0?`<button class="button secondary" data-action="project-stage" data-stage="${C.project.stages[C.project.stages.indexOf(stage)-1].id}">Previous stage</button>`:''}${C.project.stages.indexOf(stage)<5?`<button class="button" data-action="project-stage" data-stage="${C.project.stages[C.project.stages.indexOf(stage)+1].id}">Next: ${C.project.stages[C.project.stages.indexOf(stage)+1].title}</button>`:`<a class="button" href="#readiness">Find my own gaps</a>`}</div></section><section class="panel content-section" id="project-coverage"><h2>How the example connects to all 37 KSBs</h2><p class="small muted">This is a study map. Actual evidence still needs your own work, contribution, rationale and approved reference.</p><div class="project-coverage-grid">${ITEMS.map(k=>`<div><a href="#ksb-${k.id.toLowerCase()}" class="ksb-tag">${k.id}</a><span>${esc(k.title)}</span><div>${C.project.mapping[k.id].map(link=>`<button class="text-button small" data-action="project-annotation" data-id="${k.id}" data-stage="${link.stage}">${link.artifact}</button>`).join(' ')}</div></div>`).join('')}</div></section>`; }

document.addEventListener('click',async event=>{
  const themeLink=event.target.closest('[data-theme-link]');if(themeLink){event.preventDefault();ui.filters={q:'',category:'',theme:themeLink.dataset.themeLink,learning:'',evidence:'',due:false,route:''};go('library');return;}
  if(event.target.closest('.skip-link')){event.preventDefault();mainEl.focus();return;}
  const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action,id=button.dataset.id;
  if(action==='lesson-jump'){jumpLesson(button.dataset.step);return;}
  if(action==='practise-probe'){launchProbe(id);return;}
  if(action==='gap-action'){const kind=button.dataset.gapKind;if(kind==='probe')launchProbe(id);else if(kind==='example')navigateLesson(id,'answer');else if(kind==='learn')navigateLesson(id,'learn');else if(kind==='evidence')openEvidenceDraft(id);return;}
  if(action==='clear-readiness'){ui.readyCategory='';ui.readyGap='';render(true);return;}
  if(action==='project-stage'){ui.projectFocus=false;go('project-'+button.dataset.stage);return;}
  if(action==='project-annotation'){ui.projectHighlight=id;ui.projectFocus=true;go('project-'+button.dataset.stage);return;}
  if(action==='project-personal-example'){navigateLesson(id,'answer');return;}
  if(action==='project-map'){const el=document.getElementById('project-coverage');el.querySelector('h2').tabIndex=-1;el.querySelector('h2').focus({preventScroll:true});el.scrollIntoView({block:'start',behavior:'instant'});return;}
  if(action==='download-project'){download('fictional-service-capacity-portfolio.md',C.project.markdown,'text/markdown');return;}
  if(action==='project-chart'){ui.projectChart=button.dataset.chart;document.getElementById('project-dashboard').innerHTML=projectDashboard();document.querySelector(`[data-action="project-chart"][data-chart="${ui.projectChart}"]`)?.focus({preventScroll:true});return;}
  if(action==='project-join'){ui.projectJoin=button.dataset.join;document.getElementById('project-join-panel').innerHTML=projectJoinComparison();document.querySelector(`[data-action="project-join"][data-join="${ui.projectJoin}"]`)?.focus({preventScroll:true});return;}
  if(action==='approved-lookup'){download('approved_service_lookup.csv','service_id,service_name\r\n'+[1,2,3,4,5].map(i=>`S${i},Service ${i}`).join('\r\n'),'text/csv');return;}

  if(action==='backup'){backup();return;}
  if(action==='restore'){document.getElementById('backup-file').value='';document.getElementById('backup-file').click();return;}
  if(action==='recover-original'){if(recoveryRaw)download('l4-fellowship-original-recovery-'+localDate()+'.txt',recoveryRaw);return;}
  if(action==='export-summary'){exportSummary();return;}
  if(action==='text-size'){state.settings.textSize=state.settings.textSize==='normal'?'large':'normal';document.documentElement.style.setProperty('--reading',state.settings.textSize==='large'?'20px':'18px');button.setAttribute('aria-label',state.settings.textSize==='large'?'Use standard reading text size':'Increase reading text size');save();toast(state.settings.textSize==='large'?'Larger reading text enabled.':'Standard reading text enabled.');return;}
  if(action==='print'){mainEl.querySelectorAll('details').forEach(d=>{d.dataset.printOpen=d.open?'yes':'no';d.open=true;});window.print();return;}
  if(action==='study'){state.studySession={id,startedOn:localDate()};save();go('ksb-'+id.toLowerCase());return;}
  if(action==='resume-practice'){go('practice');return;}
  if(action==='clear-filters'){ui.filters={q:'',category:'',theme:'',learning:'',evidence:'',due:false,route:''};render();return;}
  if(action==='save-response'){save();toast(storageWritable?'Response saved on this device.':'Response is in temporary memory. Export a backup.');return;}
  if(action==='practise-topic'){launchProbe(id,'quick');return;}
  if(action==='record-lesson-review'){const result=document.getElementById('lesson-recall').value,date=document.getElementById('lesson-review-date').value;if(!result){toast('Choose a recall outcome before recording the review.');return;}recordRecall(id,result,date);state.attempts.push({id:uid(),ksb:id,date:localDate(),question:BY_ID[id].question,response:state.ksbs[id].response,gap:state.ksbs[id].gap,result,nextReview:state.ksbs[id].nextReview});save();render();document.querySelector('[data-action="record-lesson-review"]')?.focus({preventScroll:true});toast('Review recorded. Next review: '+prettyDate(state.ksbs[id].nextReview));return;}
  if(action==='new-evidence'||action==='add-evidence-topic'){openEvidenceDraft(action==='add-evidence-topic'?id:'');return;}
  if(action==='edit-evidence'){captureEvidence();ui.evidenceDraft=clone(state.evidence.find(e=>e.id===id));state.evidenceDraft=clone(ui.evidenceDraft);save();render();document.getElementById('ev-title')?.focus();return;}
  if(action==='delete-evidence'){const i=state.evidence.findIndex(e=>e.id===id);if(i<0)return;ui.undo=state.evidence.splice(i,1)[0];if(ui.evidenceDraft?.id===id){ui.evidenceDraft=null;state.evidenceDraft=null;}save();render();toast('Reflection deleted.',true);return;}
  if(action==='undo-evidence'){if(ui.undo){state.evidence.push(ui.undo);ui.undo=null;save();render();toast('Reflection restored.');}return;}
  if(action==='start-practice'){startPractice();return;}
  if(action==='reveal-answer'){state.session.revealed=true;save();render();const headingEl=document.querySelector('.compare-grid h2');if(headingEl){headingEl.tabIndex=-1;headingEl.focus();}return;}
  if(action==='pause-practice'){pauseTimer();go('today');return;}
  if(action==='end-practice'){if(!confirm('End this unfinished session? Previously recorded attempts stay in your history.'))return;state.session=null;save();render();return;}
  if(action==='toggle-timer'){if(state.session.running)pauseTimer();else{state.session.startedAt=Date.now();state.session.running=true;save();}button.textContent=state.session.running?'Pause':'Resume';updateTimer();return;}
  if(action==='reset-timer'){state.session.remaining=state.session.duration*60;state.session.startedAt=state.session.running?Date.now():null;save();document.getElementById('timer-finished').hidden=true;updateTimer();return;}
  if(action==='rate-practice'){const s=state.session,q=s.queue[s.index],result=button.dataset.result;recordRecall(q.id,result,s.nextDate);state.ksbs[q.id].gap=s.gap||state.ksbs[q.id].gap;state.attempts.push({id:uid(),ksb:q.id,date:localDate(),question:practiceQuestion(q),response:s.response,gap:s.gap,result,nextReview:state.ksbs[q.id].nextReview});if(s.index+1<s.queue.length){s.index++;s.response='';s.gap='';s.nextDate='';s.revealed=false;}else{state.session=null;ui.practiceCompleted=true;}save();render(true);toast('Recall recorded.');return;}
  if(action==='use-practice-response'){const s=state.session,id=s.queue[s.index].id;if(!s.response.trim()){toast('Write a response first, or record your spoken answer in the topic view.');return;}if(state.ksbs[id].response&&!confirm('Replace this topic’s existing personal response with the current practice response?'))return;state.ksbs[id].response=s.response;state.ksbs[id].exampleConfirmed=false;save();toast('Practice response copied to your personal answer.');return;}
  if(action==='copy-code'){const pre=button.parentElement.querySelector('pre');try{await navigator.clipboard.writeText(pre.textContent);toast('Code copied.');}catch(error){const selection=window.getSelection(),range=document.createRange();range.selectNodeContents(pre);selection.removeAllRanges();selection.addRange(range);toast('Code selected. Use your device’s Copy command.');}return;}
  if(action==='download-dataset'){csvDownload(button.dataset.dataset);return;}
  if(action==='apply-restore'){applyRestore();return;}
  if(action==='cancel-restore'){document.getElementById('restore-dialog').close();ui.restore=null;return;}
  if(action==='clear-data'){if(!confirm('Clear all personal responses, evidence, practice history, settings and drafts on this device? Download a backup first if you want to keep them.'))return;try{localStorage.removeItem(STORAGE_KEY);state=defaults();storageWritable=true;storageMessage='';recoveryRaw=null;ui.evidenceDraft=null;save();render();toast('Personal data cleared on this device.');}catch(error){toast('Device storage could not be cleared. Your current data is unchanged.');}return;}
});
document.addEventListener('input',event=>{const el=event.target;
  if(el.id==='library-search'){ui.filters.q=el.value;document.getElementById('library-results').innerHTML=renderResults();return;}
  if(el.dataset.ksbField){const record=state.ksbs[el.dataset.id];record[el.dataset.ksbField]=el.value;if(el.dataset.ksbField==='response'){record.exampleConfirmed=false;const checkbox=mainEl.querySelector('[data-example-confirmed]');if(checkbox){checkbox.checked=false;checkbox.disabled=!el.value.trim();}}saveSoon();return;}
  if(el.dataset.stakeholder!==undefined){state.ksbs.S12.stakeholders[Number(el.dataset.stakeholder)][el.dataset.personField]=el.value;saveSoon();return;}
  if(el.dataset.forecastField){state.ksbs.S13.forecast[el.dataset.forecastField]=el.value;saveSoon();return;}
  if(el.closest('#evidence-form')){captureEvidence();return;}
  if(state.session&&el.id==='practice-response'){state.session.response=el.value;saveSoon();return;}
  if(state.session&&el.id==='practice-gap'){state.session.gap=el.value;saveSoon();return;}
  if(state.session&&el.id==='practice-review-date'){state.session.nextDate=el.value;saveSoon();}
});
document.addEventListener('change',event=>{const el=event.target;
  if(el.id==='mobile-section'){go(el.value);return;}
  if(el.dataset.exampleConfirmed){const record=state.ksbs[el.dataset.exampleConfirmed];record.exampleConfirmed=!!el.checked&&!!record.response.trim();saveSoon();return;}
  if(el.id==='readiness-category'||el.id==='readiness-gap'){if(el.id==='readiness-category')ui.readyCategory=el.value;else ui.readyGap=el.value;document.getElementById('readiness-results').innerHTML=readinessResults();return;}
  if(el.id==='project-ksb'){ui.projectHighlight=el.value;if(el.value){ui.projectFocus=true;go('project-'+C.project.mapping[el.value][0].stage);}return;}
  if(el.id.startsWith('filter-')){const key=el.id.slice(7);ui.filters[key]=key==='due'?el.checked:el.value;document.getElementById('library-results').innerHTML=renderResults();return;}
  if(el.dataset.coverage){const id=el.dataset.coverage;state.ksbs[id].coverage[el.dataset.target]=el.value;state.ksbs[id].reviewedRevision=BY_ID[id].revision;saveSoon();return;}
  if(el.id==='evidence-filter'){ui.evidenceFilter=el.value;render();return;}
  if(el.name==='ev-ksbs'){captureEvidence();document.getElementById('evidence-rationales').innerHTML=evidenceRationales(ui.evidenceDraft);return;}
  if(el.id==='ev-status'){captureEvidence();document.getElementById('evidence-review-fields').hidden=el.value!=='reviewed';return;}
  if(el.id==='practice-mode'){ui.practiceMode=el.value;render();return;}
  if(el.id==='practice-topic'){ui.practiceId=el.value;render();return;}
  if(el.id.startsWith('mixed-')){ui.mixed[Number(el.id.slice(6))]=el.value;render();return;}
  if(el.id==='practice-duration'){ui.duration=Number(el.value);return;}
  if(el.id==='practice-timer'){ui.timer=el.checked;return;}
  if(el.id==='backup-file'){readBackup(el.files[0]);return;}
  if(el.id==='restore-mode'){ui.restore.mode=el.value;renderRestore();return;}
  if(el.dataset.restoreConflict){ui.restore.choices[el.dataset.restoreConflict]=el.value;}
});
document.addEventListener('submit',event=>{if(event.target.id==='evidence-form'){event.preventDefault();commitEvidence();return;}if(event.target.id==='plan-form'){event.preventDefault();const f=new FormData(event.target);state.settings.epaDate=String(f.get('plan-epa-date')||'');state.settings.standard=String(f.get('plan-standard')||'');state.settings.provider=String(f.get('plan-provider')||'');state.settings.assessmentOrg=String(f.get('plan-assessment')||'');state.settings.sessionLength=Number(f.get('plan-length'));state.settings.days=f.getAll('plan-days').map(Number);state.settings.ap03=document.getElementById('plan-ap03').checked;state.settings.priority=Array.from(document.getElementById('plan-priority').selectedOptions).map(o=>o.value);ui.duration=state.settings.sessionLength;save();render();toast(storageWritable?'Study plan saved on this device.':'Study plan kept in temporary memory.');}});
window.addEventListener('hashchange',()=>render(true));
window.addEventListener('beforeunload',save);
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue!==event.oldValue){storageWritable=false;storageMessage='Progress changed in another tab. This session is kept in temporary memory to avoid overwriting it. Export this session if needed, then reload to use the saved version.';updateStorageStatus();}});
window.addEventListener('focus',()=>{if(route().view==='today')render();updateTimer();});
window.addEventListener('afterprint',()=>mainEl.querySelectorAll('details[data-print-open]').forEach(d=>{d.open=d.dataset.printOpen==='yes';delete d.dataset.printOpen;}));
document.getElementById('restore-dialog').addEventListener('cancel',()=>ui.restore=null);
setInterval(updateTimer,1000);
render();
})();
</script>
</body>
